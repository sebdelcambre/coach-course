/* ---- Feuilles modales ---- */
Object.assign(UI, {
  openSession(date){ const { week, day } = Plan.forDate(date); const s = day.run; const z = week.z; const key = `${date}:run`; const st = day.statusRun;
    const btn = (v,l) => `<button class="btn sm ${st===v?'primary':''}" onclick="UI.mark('${key}','${v}','${date}')">${l}</button>`;
    const ov = (Data.state.plan.overrides||{})[key];
    UI.sheet(`<div class="muted small">${Util.fmtDateLong(date)}${s.custom?' · séance modifiée':s.movedFrom?' · déplacée du '+Util.fmtDate(s.movedFrom):''}</div><h2>${Util.esc(s.title)}</h2>
      ${UI.ribbon(s,z)}<div class="row small" style="gap:14px"><b>${s.km?Util.km(s.km)+' km':''}</b><b>${Util.fmtDur(s.min)}</b>${s.zone&&s.zone!=='X'&&s.zone!=='AC'?`<span class="pill z ${s.zone}">${Physio.zoneName[s.zone]}</span>`:''}</div>
      <p style="margin:12px 0">${Util.esc(s.intent)}</p>
      ${UI.steps(s,z)}
      ${s.why?`<details open><summary>Pourquoi cette séance</summary><div class="body"><p>${Util.esc(s.why)}</p>${s.ytKey&&Lib.yt[s.ytKey]?`<p class="small"><a href="${Lib.ytLink(s.ytKey)}" target="_blank" rel="noopener">▶ ${Lib.yt[s.ytKey]}</a></p>`:''}</div></details>`:''}
      ${s.kind!=='RACE'?`<div class="btnrow" style="margin-top:14px">${s.kind!=='X'?btn('done','Faite'):''}<button class="btn sm ${st==='modified'?'primary':''}" onclick="UI.openEdit('${date}')">Modifier</button>${s.kind!=='X'?btn('skipped','Sautée'):''}</div>
      <div class="btnrow" style="margin-top:8px">${s.kind!=='X'?`<button class="btn" onclick="UI.openLog(null,'${date}')">Enregistrer dans le journal</button>`:''}${st?`<button class="btn sm" onclick="UI.mark('${key}',null)">Effacer le statut</button>`:''}${ov||s.movedFrom?`<button class="btn sm" onclick="UI.resetEdit('${date}')">Séance prévue</button>`:''}</div>`:''}`); },

  /* Modifier une séance planifiée : remplacer le type / la distance, ou l'échanger avec un autre jour */
  openEdit(date){ const { week, day } = Plan.forDate(date); const s = day.run; const key = `${date}:run`; const ov = (Data.state.plan.overrides||{})[key] || {};
    const curType = ov.type || ({recup:'recup',progressif:'progressif',tempo:'tempo',seuilContinu:'seuilContinu',seuilFractionne:'seuilFractionne',vo2:'vo2',fartlek:'fartlek',cotesCourtes:'cotesCourtes',cotesLongues:'cotesLongues',montees:'montees',descente:'descente',marcheRapide:'marcheRapide',cross:'cross',rest:'rest'})[s.id] || (s.kind==='L' ? 'longue' : 'endurance');
    const others = week.days.filter(d => d.date!==date && d.run.kind!=='RACE');
    UI.sheet(`<div class="muted small">${Util.fmtDateLong(date)}</div><h2>Modifier la séance</h2><p class="small muted">Prévu : ${Util.esc(s.title)}. La modification s'applique seulement à ce jour ; le reste de la semaine ne bouge pas.</p>
      <div class="field" style="margin-top:12px"><label>Type de séance</label><select id="e_type">${Plan.customTypes.map(([k,l])=>`<option value="${k}" ${curType===k?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label>Distance visée (km, optionnel — ajuste l'échauffement et les répétitions)</label><input id="e_km" type="number" inputmode="decimal" step="0.5" value="${ov.km||''}" placeholder="${s.km||''}"></div>
      <div class="field"><label>Note (optionnel)</label><input id="e_note" type="text" value="${Util.esc(ov.note||'')}" placeholder="Sur tapis, avec un ami, remplace la sortie de jeudi…"></div>
      <button class="btn primary" onclick="UI.saveEdit('${date}')">Enregistrer la modification</button>
      <div class="section-title"><h2>Ou échanger avec un autre jour</h2></div>
      <div class="list">${others.map(d=>`<button class="item" style="width:100%;text-align:left" onclick="UI.swapEdit('${date}','${d.date}')"><div class="t"><b>${Util.dowLong[d.dow]} ${Util.parse(d.date).getDate()}</b><span>${Util.esc(d.run.title)}${d.run.km?' · '+Util.km(d.run.km)+' km':''}</span></div></button>`).join('')}</div>
      <p class="tiny muted" style="margin-top:10px">Astuce : dans l'écran Plan, maintiens une séance et glisse-la sur un autre jour.</p>
      ${ov.kind||s.movedFrom?`<button class="btn" style="margin-top:12px" onclick="UI.resetEdit('${date}')">Revenir à la séance prévue</button>`:''}`); },
  saveEdit(date){ const key = `${date}:run`; const o = { kind:'replace', type:UI.val('e_type'), km:UI.num('e_km'), note:UI.val('e_note') };
    Plan.setOverride(key, o); Plan.setStatus(key, 'modified'); UI.closeSheet(); UI.render(); UI.toast('Séance modifiée'); },
  swapEdit(date, other, slot){ Plan.swap(date, other, slot||'run'); UI.closeSheet(); UI.render(); UI.toast(slot==='renfo' ? 'Renforcement déplacé' : 'Séances échangées'); },
  resetEdit(date){ const key = `${date}:run`; Plan.setOverride(key, null); Plan.resetMove(date, 'run'); Plan.setStatus(key, null); UI.closeSheet(); UI.render(); UI.toast('Séance prévue rétablie'); },
  mark(key, status, date){ Plan.setStatus(key, status); if(status==='skipped' && date){ const m = Util.iso(Util.monday(Util.parse(date))); if(!Data.state.plan.adjust[m]) Plan.setAdjust(m,'skipped',date); }
    UI.closeSheet(); UI.render(); UI.toast(status?({done:'Séance marquée faite',modified:'Séance marquée modifiée',skipped:'Séance sautée — semaine ajustée'})[status]:'Statut effacé');
    if(status==='done' && date){ setTimeout(()=>UI.openLog(null,date), 250); } },
  openStrength(date){ const { day } = Plan.forDate(date); const s = day.strength; if(!s) return; const key = `${date}:renfo`; const st = day.statusRenfo; UI._alt = false;
    const render = () => { const ex = UI._alt && s.alt ? s.alt : s.exercises;
      const pr = UI._alt && s.alt ? (s.pref==='maison'?'salle':'maison') : (s.pref||'maison');
      UI.sheet(`<div class="muted small">${Util.fmtDateLong(date)} · ${Util.fmtDur(s.min)}${s.movedFrom?' · déplacé du '+Util.fmtDate(s.movedFrom):''}</div><h2>${Util.esc(s.title)}</h2><p>${Util.esc(s.intent)}</p>
      <div style="margin:12px 0">${ex.map((e,i)=>`<div class="ex"><span class="pic">${Strength.pics[e[3]]||Strength.pics.squat}</span><div class="b"><b>${e[0]}</b><div class="tg">${e[1]}${e[2]&&e[2]!=='—'?' · tempo '+e[2]:''}</div>${e[4]?`<div class="how">${e[4]}</div>`:''}<div class="exlinks">${s.blockIdx!=null?`<a href="${Strength.PDF}#page=${Strength.pdfPage(s.blockIdx, pr, i)}" target="_blank" rel="noopener">Fiche PDF (p. ${Strength.pdfPage(s.blockIdx, pr, i)})</a>`:''}${e[5]?`<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(e[5]+' exercice')}" target="_blank" rel="noopener">▶ Vidéo</a>`:''}</div></div></div>`).join('')}</div>
      <a class="btn sm" style="text-decoration:none" href="${Strength.PDF}" target="_blank" rel="noopener">Guide PDF complet des exercices</a>
      ${s.alt?`<button class="btn sm" onclick="UI._alt=!UI._alt;UI._renderStrength()">${UI._alt?'Revenir à ma version':s.altLabel}</button>`:''}
      <details style="margin-top:8px"><summary>Pourquoi</summary><div class="body"><p>${s.why}</p>${s.ytKey?`<p class="small"><a href="${Lib.ytLink(s.ytKey)}" target="_blank" rel="noopener">▶ ${Lib.yt[s.ytKey]}</a></p>`:''}</div></details>
      <div class="btnrow" style="margin-top:14px"><button class="btn sm ${st==='done'?'primary':''}" onclick="UI.mark('${key}','done')">Faite</button><button class="btn sm ${st==='skipped'?'primary':''}" onclick="UI.mark('${key}','skipped')">Sautée</button>${st?`<button class="btn sm" onclick="UI.mark('${key}',null)">Effacer</button>`:''}${s.movedFrom?`<button class="btn sm" onclick="Plan.resetMove('${date}','renfo');UI.closeSheet();UI.render()">Jour prévu</button>`:''}</div>`); };
    UI._renderStrength = render; render(); },

  openLog(id, date){ const a = id ? Data.state.activities.find(x=>x.id===id) : null; let pre = {};
    if(!a && date){ const { day } = Plan.forDate(date); const s = day.run; if(s && s.kind!=='X'){ pre = { type:({endurance:'endurance',recup:'recuperation',tempo:'tempo',seuilContinu:'seuil',seuilFractionne:'seuil',vo2:'intervalles',fartlek:'fartlek',cotesCourtes:'cotes',cotesLongues:'cotes',montees:'trail',descente:'trail',marcheRapide:'trail',longue:'longue',longueBlocs:'longue',longueProg:'longue',longueDplus:'trail',longueRavito:'longue',race:'course',progressif:'tempo',allureCourse:'tempo',sharpener:'intervalles',shakeout:'endurance'})[s.id]||'endurance', distance:s.km, duration:s.min*60, plannedKey:`${date}:run` }; } }
    const v = Object.assign({ date:date||Util.iso(Util.today()), type:'endurance', distance:'', duration:'', hrAvg:'', elevation:'', feel:7, pain:0, weather:'', notes:'' }, pre, a||{});
    UI.sheet(`<h2>${a?'Modifier la séance':'Enregistrer une séance'}</h2>
      <div class="grid2"><div class="field"><label>Date</label><input id="f_date" type="date" value="${v.date}"></div><div class="field"><label>Type</label><select id="f_type">${Object.entries(Stats.typeName).map(([k,n])=>`<option value="${k}" ${v.type===k?'selected':''}>${n}</option>`).join('')}</select></div></div>
      <div class="grid2"><div class="field"><label>Distance (km)</label><input id="f_dist" type="number" inputmode="decimal" step="0.1" value="${v.distance||''}" placeholder="10.5"></div><div class="field"><label>Temps</label>${UI.timeInput('f_dur', v.duration)}</div></div>
      <div class="grid2"><div class="field"><label>FC moyenne</label><input id="f_hr" type="number" inputmode="numeric" value="${v.hrAvg||''}" placeholder="152"></div><div class="field"><label>Dénivelé + (m)</label><input id="f_elev" type="number" inputmode="numeric" value="${v.elevation||''}" placeholder="120"></div></div>
      <div class="field"><label>Ressenti : <b id="feelLbl">${v.feel}</b>/10 (10 = très facile)</label><input id="f_feel" type="range" min="1" max="10" value="${v.feel}" oninput="document.getElementById('feelLbl').textContent=this.value"></div>
      <div class="field"><label>Douleur : <b id="painLbl">${v.pain}</b>/10</label><input id="f_pain" type="range" min="0" max="10" value="${v.pain}" oninput="document.getElementById('painLbl').textContent=this.value"></div>
      <div class="grid2"><div class="field"><label>Météo</label><input id="f_weather" type="text" value="${Util.esc(v.weather)}" placeholder="18 °C, vent"></div><div class="field"><label>Notes</label><input id="f_notes" type="text" value="${Util.esc(v.notes)}" placeholder="Jambes lourdes, gel à 45 min…"></div></div>
      <div class="btnrow"><button class="btn primary" onclick="UI.saveLog('${a?a.id:''}','${v.plannedKey||''}')">Enregistrer</button>${a?`<button class="btn danger sm" onclick="UI.deleteLog('${a.id}')">Supprimer</button>`:''}</div>`); },
  saveLog(id, plannedKey){ const o = { date:UI.val('f_date'), type:UI.val('f_type'), distance:UI.num('f_dist'), duration:UI.readTime('f_dur'), hrAvg:UI.num('f_hr'), elevation:UI.num('f_elev'), feel:UI.num('f_feel'), pain:UI.num('f_pain'), weather:UI.val('f_weather'), notes:UI.val('f_notes') };
    if(!o.date){ UI.toast('Il manque la date'); return; }
    if(id){ Object.assign(Data.state.activities.find(x=>x.id===id), o); } else { o.id = Util.uid(); o.plannedKey = plannedKey||null; Data.state.activities.push(o); if(plannedKey && !Data.state.plan.status[plannedKey]) Data.state.plan.status[plannedKey] = 'done'; }
    if(o.pain>=4 && Data.state.profile.trafficLight==='vert'){ Data.state.profile.trafficLight='jaune'; Data.state.profile.trafficNote='Douleur '+o.pain+'/10 notée le '+Util.fmtDate(o.date); UI.toast('Douleur ≥ 4 : feu passé au jaune'); }
    Data.save(); UI.closeSheet(); UI.render(); },
  deleteLog(id){ if(!confirm('Supprimer cette séance du journal ?')) return; Data.state.activities = Data.state.activities.filter(x=>x.id!==id); Data.save(); UI.closeSheet(); UI.render(); },

  openRace(id){ const r = id ? Data.state.races.find(x=>x.id===id) : null; const t = Util.iso(Util.today()); const z = Physio.zones();
    if(r){ const past = r.date < t; const pred = r.type==='trail'?Physio.predictTrail(z.vdot,r.distanceKm,r.elevation):Physio.predict(z.vdot,r.distanceKm*1000); const dj = Util.daysBetween(Util.today(), Util.parse(r.date));
      const wi = Plan.weekInfo(Util.monday(Util.today())); const phase = (wi.race && wi.race.id===r.id && !wi.inGap) ? Plan.phaseName[wi.phase] : null;
      const seg = Plan.season().segs.find(s => s.race.id===r.id); const segLine = seg && !past ? `Bloc d'entraînement de ${seg.N} semaines${phase?'':' · dès le '+Util.fmtDate(Util.iso(Util.addDays(Plan.season().start, seg.startIdx*7)), true)}` : null;
      UI.sheet(`<div class="row between"><span class="pill ${r.priority==='C'?'Cprio':r.priority}">Priorité ${r.priority}</span><span class="small muted">${past?'Passée':dj===0?'Aujourd\'hui':'J-'+dj}</span></div><h2 style="margin-top:8px">${Util.esc(r.name)}</h2>
        <p class="muted">${Util.fmtDateLong(r.date)} ${Util.parse(r.date).getFullYear()} · ${r.distanceKm} km ${r.type==='trail'?'trail · '+(r.elevation||0)+' m D+':'route · '+(r.elevation||0)+' m D+'}${r.location?' · '+Util.esc(r.location):''}</p>
        ${r.notes?`<p class="small" style="margin-top:6px">${Util.esc(r.notes)}</p>`:''}
        <div class="grid2" style="margin:12px 0"><div class="stat"><div class="v num">${r.goalTime?Util.fmtTime(r.goalTime):'—'}</div><div class="l">temps visé</div></div><div class="stat"><div class="v num">${Util.fmtTime(pred)}</div><div class="l">prédit (VDOT ${z.vdot})</div></div></div>
        ${r.goalTime?`<p class="small muted">Allure cible ${Util.fmtPace(r.goalTime/r.distanceKm)}/km${r.type==='route'?` · allure prédite ${Util.fmtPace(pred/r.distanceKm)}/km`:''}. ${r.goalTime<pred*0.97?'Objectif ambitieux par rapport au VDOT : il faudra une prépa propre et une bonne journée.':'Objectif cohérent avec ta forme actuelle.'}</p>`:''}
        ${phase?`<p class="small" style="margin-top:6px">Bloc en cours · phase actuelle : <b>${phase}</b></p>`:segLine?`<p class="small muted" style="margin-top:6px">${segLine}</p>`:''}
        ${r.result?`<div class="card flat" style="margin-top:12px"><b>Résultat : ${Util.fmtTime(r.result.time)}</b> · ${Util.fmtPace(r.result.time/r.distanceKm)}/km${r.result.rank?' · '+Util.esc(r.result.rank):''}${r.result.feel?' · ressenti '+r.result.feel+'/10':''}${r.result.learnings?`<p class="small" style="margin-top:6px">${Util.esc(r.result.learnings)}</p>`:''}</div>`:''}
        <div class="btnrow" style="margin-top:12px">${!past?`<button class="btn primary" onclick="UI.openChecklist('${r.id}')">Check-list pré-course</button>`:''}<button class="btn" onclick="UI.openResult('${r.id}')">${r.result?'Modifier le résultat':'Saisir le résultat'}</button></div>
        <div class="btnrow" style="margin-top:8px"><button class="btn sm" onclick="UI.editRace('${r.id}')">Modifier</button><button class="btn sm danger" onclick="UI.deleteRace('${r.id}')">Supprimer</button></div>`); }
    else UI.editRace(null); },
  editRace(id){ const r = (id ? Data.state.races.find(x=>x.id===id) : null) || { name:'', date:'', distanceKm:'', type:'route', elevation:'', goalTime:null, priority:'B', location:'', notes:'' };
    UI.sheet(`<h2>${id?'Modifier la course':'Nouvelle course'}</h2>
      <div class="field"><label>Nom</label><input id="r_name" type="text" value="${Util.esc(r.name)}" placeholder="Demi-marathon de…"></div>
      <div class="grid2"><div class="field"><label>Date</label><input id="r_date" type="date" value="${r.date}"></div><div class="field"><label>Distance (km)</label><input id="r_dist" type="number" inputmode="decimal" step="0.1" value="${r.distanceKm}"></div></div>
      <div class="grid2"><div class="field"><label>Type</label><select id="r_type"><option value="route" ${r.type==='route'?'selected':''}>Route</option><option value="trail" ${r.type==='trail'?'selected':''}>Trail</option></select></div><div class="field"><label>Dénivelé + (m)</label><input id="r_elev" type="number" inputmode="numeric" value="${r.elevation||''}"></div></div>
      <div class="grid2"><div class="field"><label>Temps visé</label>${UI.timeInput('r_goal', r.goalTime)}</div><div class="field"><label>Priorité</label><select id="r_prio"><option value="A" ${r.priority==='A'?'selected':''}>A — objectif</option><option value="B" ${r.priority==='B'?'selected':''}>B — préparation</option><option value="C" ${r.priority==='C'?'selected':''}>C — plaisir / test</option></select></div></div>
      <div class="field"><label>Lieu</label><input id="r_loc" type="text" value="${Util.esc(r.location)}"></div>
      <div class="field"><label>Notes</label><textarea id="r_notes">${Util.esc(r.notes)}</textarea></div>
      <button class="btn primary" onclick="UI.saveRace('${id||''}')">Enregistrer</button>`); },
  saveRace(id){ const o = { name:UI.val('r_name'), date:UI.val('r_date'), distanceKm:UI.num('r_dist'), type:UI.val('r_type'), elevation:UI.num('r_elev')||0, goalTime:UI.readTime('r_goal'), priority:UI.val('r_prio'), location:UI.val('r_loc'), notes:UI.val('r_notes') };
    if(!o.name||!o.date||!o.distanceKm){ UI.toast('Nom, date et distance sont requis'); return; }
    if(id) Object.assign(Data.state.races.find(x=>x.id===id), o); else { o.id = Util.uid(); o.result = null; Data.state.races.push(o); }
    Data.ensurePlanAnchor(); Data.save(); UI.closeSheet(); UI.render(); UI.toast('Course enregistrée'); },
  deleteRace(id){ if(!confirm('Supprimer cette course ? Les records associés sont conservés.')) return; Data.state.races = Data.state.races.filter(x=>x.id!==id); Data.ensurePlanAnchor(); Data.save(); UI.closeSheet(); UI.render(); },
  openResult(id){ const r = Data.state.races.find(x=>x.id===id); const v = r.result || { time:null, rank:'', feel:7, learnings:'' };
    UI.sheet(`<h2>Résultat · ${Util.esc(r.name)}</h2>
      <div class="grid2"><div class="field"><label>Temps réalisé</label>${UI.timeInput('s_time', v.time)}</div><div class="field"><label>Classement</label><input id="s_rank" type="text" value="${Util.esc(v.rank)}" placeholder="120/850"></div></div>
      <div class="field"><label>Ressenti : <b id="sFeel">${v.feel}</b>/10</label><input id="s_feel" type="range" min="1" max="10" value="${v.feel}" oninput="document.getElementById('sFeel').textContent=this.value"></div>
      <div class="field"><label>Apprentissages (nutrition, hydratation, matériel, allure)</label><textarea id="s_learn" placeholder="Gel toutes les 30 min : parfait. Chaussettes trop épaisses…">${Util.esc(v.learnings)}</textarea></div>
      <button class="btn primary" onclick="UI.saveResult('${id}')">Enregistrer le résultat</button>`); },
  saveResult(id){ const r = Data.state.races.find(x=>x.id===id); const time = UI.readTime('s_time'); if(!time){ UI.toast('Temps invalide'); return; }
    r.result = { time, rank:UI.val('s_rank'), feel:UI.num('s_feel'), learnings:UI.val('s_learn'), date:r.date };
    const key = Physio.distanceKey(r.distanceKm, r.type); const already = Data.state.records.find(x=>x.raceId===r.id);
    let isBest = false; if(already){ already.time = time; already.date = r.date; } else isBest = Stats.addRecordIfBest(key, time, r.date, r.name, r.id);
    if(!Data.state.activities.some(a=>a.raceId===r.id)) Data.state.activities.push({ id:Util.uid(), date:r.date, type:'course', distance:r.distanceKm, duration:time, elevation:r.elevation, feel:r.result.feel, pain:0, notes:'Course : '+r.name, weather:'', raceId:r.id });
    Data.save(); UI.closeSheet(); UI.render(); UI.toast(isBest?'Nouveau record personnel !':'Résultat enregistré'); },
  openPR(key){ const list = Data.state.records.filter(r=>r.distanceKey===key).sort((a,b)=>a.date<b.date?-1:1);
    UI.sheet(`<h2>${key.replace('K',' km').replace(' kmT',' km trail')}</h2>${list.length?`<div class="list">${list.map((r,i)=>{ const prev = list.slice(0,i).sort((a,b)=>a.time-b.time)[0]; const diff = prev? r.time-prev.time : 0;
      return `<div class="item"><div class="t"><b>${Util.fmtTime(r.time)}</b><span>${Util.fmtDate(r.date,true)}${r.label?' · '+Util.esc(r.label):''}</span></div><div class="r num small ${diff<0?'':'muted'}" style="${diff<0?'color:var(--vert)':''}">${prev?(diff<0?'−':'+')+Util.fmtTime(Math.abs(diff)):'premier'}</div></div>`;}).join('')}</div>`:'<div class="empty">Aucun chrono sur cette distance. Saisis un résultat de course ou un test.</div>'}
      <div class="field" style="margin-top:12px"><label>Ajouter un chrono manuellement</label>${UI.timeInput('pr_time', null)}</div><div class="field"><label>Date du chrono</label><input id="pr_date" type="date" value="${Util.iso(Util.today())}"></div>
      <button class="btn primary" onclick="UI.addPR('${key}')">Ajouter</button>`); },
  addPR(key){ const t = UI.readTime('pr_time'); if(!t){ UI.toast('Temps invalide'); return; } const best = Stats.addRecordIfBest(key, t, UI.val('pr_date'), 'Saisie manuelle'); Data.save(); UI.closeSheet(); UI.render(); UI.toast(best?'Nouveau record !':'Chrono ajouté'); },

  openChecklist(id){ const r = Data.state.races.find(x=>x.id===id); const items = Coach.checklist(r); const done = Data.state.plan.checklist[id] || {}; const groups = [...new Set(items.map(i=>i.group))];
    UI.sheet(`<h2>Check-list · ${Util.esc(r.name)}</h2><p class="small muted">${Util.fmtDateLong(r.date)} · ${r.distanceKm} km ${r.type}</p>
      ${groups.map(g=>`<div class="section-title"><h2>${g}</h2></div><div class="card">${items.filter(i=>i.group===g).map(i=>`<label class="check"><input type="checkbox" ${done[i.key]?'checked':''} onchange="UI.tickCheck('${id}','${i.key}',this.checked)"><span>${i.text}</span></label>`).join('')}</div>`).join('')}
      <button class="btn sm" onclick="Data.state.plan.checklist['${id}']={};Data.save();UI.openChecklist('${id}')">Tout décocher</button>`); },
  tickCheck(id, key, on){ const c = Data.state.plan.checklist; if(!c[id]) c[id] = {}; if(on) c[id][key] = true; else delete c[id][key]; Data.save(); },

  openAdjust(mondayIso){ const cur = Data.state.plan.adjust[mondayIso]; const w = Plan.build(Util.parse(mondayIso));
    const opts = [['jaune','Feu jaune — petite douleur','Zéro intensité, volume −20 %, isométrie.'],['rouge','Feu rouge — blessure','Pas de course. Vélo/marche sans douleur.'],['fatigue','Fatigué','Volume −25 %, une seule qualité.'],['voyage','En voyage','On garde une qualité et la sortie longue.'],['skipped','J\'ai sauté une séance','On ne rattrape pas, on continue.']];
    UI.sheet(`<h2>Ajuster la semaine</h2><p class="small muted">${Util.weekLabel(Util.parse(mondayIso))}. Le reste de la semaine est redistribué automatiquement.</p>
      <div class="list">${opts.map(([k,t,d])=>`<button class="item" style="width:100%;text-align:left" onclick="UI.applyAdjust('${mondayIso}','${k}')"><div class="t"><b>${t}</b><span>${d}</span></div>${cur&&cur.mode===k?'<span class="pill A">Actif</span>':''}</button>`).join('')}</div>
      ${cur?`<button class="btn" style="margin-top:12px" onclick="UI.applyAdjust('${mondayIso}',null)">Revenir au plan normal</button>`:''}
      ${w.mode==='skipped'||!cur?`<p class="tiny muted" style="margin-top:12px">Pour sauter une séance précise, ouvre-la et touche « Sautée ».</p>`:''}`); },
  applyAdjust(mondayIso, mode){ Plan.setAdjust(mondayIso, mode); if(mode==='jaune'||mode==='rouge'){ Data.state.profile.trafficLight = mode; Data.save(); } UI.closeSheet(); UI.render(); UI.toast(mode?'Semaine ajustée':'Plan normal rétabli'); },

  /* ---- Assistant « Nouveau plan » : course objectif (route ou trail), disponibilités, départ ---- */
  openNewPlan(){ const p = Data.state.profile; const t = Util.iso(Util.today());
    const up = Data.state.races.filter(r => r.date >= t).sort((a,b)=>a.date<b.date?-1:1);
    UI._npMode = up.length ? 'exist' : 'new'; UI._npType = 'route'; UI._npGym = p.gymPref;
    const cur = Plan.raceA();
    const dayChips = Plan.dayOrder.map(d=>`<button class="chip np-day ${p.availableDays.includes(d)?'on':''}" data-d="${d}" onclick="this.classList.toggle('on')">${Util.dowShort[d]}</button>`).join('');
    const m0 = Util.monday(Util.today());
    UI.sheet(`<h2>Nouveau plan de course</h2><p class="small muted">Choisis ta course objectif — route ou trail — et tes disponibilités : le plan se construit automatiquement jusqu'au jour J, avec une sortie longue par semaine et 2 renforcements.</p>
      <div class="section-title"><h2>1 · La course objectif</h2></div>
      ${up.length?`<div class="seg" style="margin-bottom:12px"><button id="npSegE" class="${UI._npMode==='exist'?'on':''}" onclick="UI.npMode('exist')">Une de mes courses</button><button id="npSegN" class="${UI._npMode==='new'?'on':''}" onclick="UI.npMode('new')">Nouvelle course</button></div>`:''}
      <div id="npExist" style="display:${UI._npMode==='exist'?'block':'none'}">
        <div class="field"><label>Course</label><select id="np_race">${up.map(r=>`<option value="${r.id}" ${cur&&cur.id===r.id?'selected':''}>${Util.esc(r.name)} — ${Util.fmtDate(r.date,true)} · ${r.distanceKm} km ${r.type==='trail'?'trail':'route'}</option>`).join('')}</select></div>
      </div>
      <div id="npNew" style="display:${UI._npMode==='new'?'block':'none'}">
        <div class="field"><label>Nom de la course</label><input id="np_name" type="text" placeholder="Demi-marathon de…, Trail du…"></div>
        <div class="grid2"><div class="field"><label>Date</label><input id="np_date" type="date" min="${t}"></div><div class="field"><label>Distance (km)</label><input id="np_dist" type="number" inputmode="decimal" step="0.1" placeholder="21.1"></div></div>
        <div class="grid2"><div class="field"><label>Type</label><div class="seg"><button id="npTypeRoute" class="on" onclick="UI.npType('route')">Route</button><button id="npTypeTrail" onclick="UI.npType('trail')">Trail</button></div></div><div class="field"><label>Dénivelé + (m)</label><input id="np_elev" type="number" inputmode="numeric" placeholder="0"></div></div>
        <div class="field"><label>Temps visé (optionnel)</label>${UI.timeInput('np_goal', null)}</div>
      </div>
      <div class="section-title"><h2>2 · Mes disponibilités</h2></div>
      <div class="field"><label>Jours de course à pied (minimum 2)</label><div class="chips" id="npDays">${dayChips}</div></div>
      <div class="grid2"><div class="field"><label>Volume de départ (km/sem)</label><input id="np_vol" type="number" inputmode="numeric" value="${p.weeklyVolume}"></div><div class="field"><label>Volume max (km/sem)</label><input id="np_max" type="number" inputmode="numeric" value="${p.maxVolume}"></div></div>
      <div class="field"><label>Renforcement (2 ×/semaine)</label><div class="seg"><button id="npGymM" class="${p.gymPref==='maison'?'on':''}" onclick="UI.npGym('maison')">Maison</button><button id="npGymS" class="${p.gymPref==='salle'?'on':''}" onclick="UI.npGym('salle')">Salle</button></div></div>
      <div class="section-title"><h2>3 · Départ du plan</h2></div>
      <div class="field"><label>Première semaine</label><select id="np_start"><option value="now">Cette semaine (lundi ${Util.fmtDate(Util.iso(m0))})</option><option value="next">Lundi prochain (${Util.fmtDate(Util.iso(Util.addDays(m0,7)))})</option></select></div>
      <p class="tiny muted">Ton journal, tes courses et tes records sont toujours conservés. Seuls les statuts, ajustements et déplacements du plan actuel seront remis à zéro.</p>
      <button class="btn primary" style="margin-top:10px" onclick="UI.saveNewPlan()">Créer mon plan</button>`); },
  npMode(m){ UI._npMode = m; const ex = document.getElementById('npExist'), nw = document.getElementById('npNew'); if(ex) ex.style.display = m==='exist'?'block':'none'; if(nw) nw.style.display = m==='new'?'block':'none';
    const e = document.getElementById('npSegE'), n = document.getElementById('npSegN'); if(e&&n){ e.classList.toggle('on', m==='exist'); n.classList.toggle('on', m==='new'); } },
  npType(t){ UI._npType = t; document.getElementById('npTypeRoute').classList.toggle('on', t==='route'); document.getElementById('npTypeTrail').classList.toggle('on', t==='trail'); },
  npGym(g){ UI._npGym = g; document.getElementById('npGymM').classList.toggle('on', g==='maison'); document.getElementById('npGymS').classList.toggle('on', g==='salle'); },
  saveNewPlan(){ const p = Data.state.profile; let raceId = null;
    if(UI._npMode==='new'){ const name = UI.val('np_name'), date = UI.val('np_date'), dist = UI.num('np_dist');
      if(!name || !date || !dist){ UI.toast('Nom, date et distance sont requis'); return; }
      if(date < Util.iso(Util.today())){ UI.toast('La date de la course doit être à venir'); return; }
      const r = { id:Util.uid(), name, date, distanceKm:dist, type:UI._npType||'route', elevation:UI.num('np_elev')||0, goalTime:UI.readTime('np_goal'), priority:'A', location:'', notes:'', result:null };
      Data.state.races.push(r); raceId = r.id; }
    else { raceId = UI.val('np_race'); if(!raceId){ UI.toast('Choisis une course'); return; } }
    const days = Array.from(document.querySelectorAll('#npDays .np-day.on')).map(b => parseInt(b.dataset.d));
    if(days.length < 2){ UI.toast('Choisis au moins 2 jours de course'); return; }
    if(!confirm('Créer ce nouveau plan ? Les statuts et déplacements du plan actuel seront remis à zéro. Journal, courses et records sont conservés.')) return;
    p.availableDays = days; p.weeklyVolume = Math.max(10, UI.num('np_vol') || p.weeklyVolume); p.maxVolume = Math.max(p.weeklyVolume, UI.num('np_max') || p.maxVolume);
    if(UI._npGym) p.gymPref = UI._npGym;
    p.targetRaceId = raceId; p.planRaceId = raceId;
    const m0 = Util.monday(Util.today()); p.planStart = Util.iso(UI.val('np_start')==='next' ? Util.addDays(m0,7) : m0);
    Data.state.plan.status = {}; Data.state.plan.adjust = {}; Data.state.plan.overrides = {}; Data.state.plan.moves = {};
    Data.save(); UI.closeSheet(); UI.weekOffset = 0; UI.go('plan'); UI.toast('Nouveau plan créé'); },
  resetPlan(){ if(!confirm('Remettre le plan à zéro ? Statuts, ajustements et déplacements seront effacés. Ton journal, tes courses et tes records sont conservés.')) return;
    const p = Data.state.profile; Data.state.plan.status = {}; Data.state.plan.adjust = {}; Data.state.plan.overrides = {}; Data.state.plan.moves = {};
    p.planStart = null; p.planRaceId = null; p.targetRaceId = null;
    Data.ensurePlanAnchor(); Data.save(); UI.closeSheet(); UI.weekOffset = 0; UI.render(); UI.toast('Plan remis à zéro');
    setTimeout(()=>UI.openNewPlan(), 400); },

  openTrafficLight(){ const p = Data.state.profile;
    UI.sheet(`<h2>Feu de circulation</h2><p class="small muted">Indique ton état : le plan de la semaine s'adapte automatiquement.</p>
      <div class="chips" style="margin:12px 0">${[['vert','Vert · tout va bien'],['jaune','Jaune · gêne légère'],['rouge','Rouge · douleur']].map(([k,l])=>`<button class="chip ${p.trafficLight===k?'on '+k:''}" onclick="UI.setLight('${k}')">${l}</button>`).join('')}</div>
      <div class="field"><label>Où et quoi ? (optionnel)</label><input id="tl_note" type="text" value="${Util.esc(p.trafficNote||'')}" placeholder="Tendon d'Achille droit, 2/10 le matin" onchange="Data.state.profile.trafficNote=this.value;Data.save()"></div>
      <details><summary>Le protocole</summary><div class="body"><ul class="clean">${Coach.tips.find(t=>t.k==='feu').body.map(b=>`<li>${b}</li>`).join('')}</ul></div></details>`); },
  setLight(k){ const p = Data.state.profile; p.trafficLight = k; const m = Util.iso(Util.monday(Util.today())); const cur = Data.state.plan.adjust[m];
    if(k==='vert'){ if(cur && (cur.mode==='jaune'||cur.mode==='rouge')) Plan.setAdjust(m, null); } else Plan.setAdjust(m, k);
    Data.save(); UI.closeSheet(); UI.render(); UI.toast('Feu '+k+({vert:' : plan normal',jaune:' : semaine allégée',rouge:' : arrêt de la course'})[k]); },

  openSettings(){ const p = Data.state.profile; const z = Physio.zones(); const v = Physio.currentVdot();
    const dayChips = Plan.dayOrder.map(d=>`<button class="chip ${p.availableDays.includes(d)?'on':''}" onclick="UI.toggleDay(${d})">${Util.dowShort[d]}</button>`).join('');
    const mz = p.manualZones; const zi = (k,i) => `<input type="text" inputmode="decimal" value="${Util.fmtPace(mz[k][i])}" placeholder="5.30" style="width:100%" onchange="UI.setManualZone('${k}',${i},this.value)">`;
    UI.sheet(`<h2>Réglages</h2>
      <div class="section-title"><h2>Entraînement</h2></div>
      <div class="field"><label>Jours disponibles pour courir (${p.availableDays.length})</label><div class="chips">${dayChips}</div></div>
      <div class="grid2"><div class="field"><label>Volume de départ (km/sem)</label><input type="number" inputmode="numeric" value="${p.weeklyVolume}" onchange="Data.state.profile.weeklyVolume=Math.max(10,parseInt(this.value)||35);Data.save()"></div><div class="field"><label>Volume maximum (km/sem)</label><input type="number" inputmode="numeric" value="${p.maxVolume}" onchange="Data.state.profile.maxVolume=Math.max(20,parseInt(this.value)||60);Data.save()"></div></div>
      <div class="field"><label>Renforcement</label><div class="seg"><button class="${p.gymPref==='maison'?'on':''}" onclick="Data.state.profile.gymPref='maison';Data.save();UI.openSettings()">Maison</button><button class="${p.gymPref==='salle'?'on':''}" onclick="Data.state.profile.gymPref='salle';Data.save();UI.openSettings()">Salle</button></div></div>
      <div class="btnrow" style="margin-top:4px"><button class="btn sm" onclick="UI.openNewPlan()">Nouveau plan de course</button><button class="btn sm danger" onclick="UI.resetPlan()">Réinitialiser le plan</button></div>
      <p class="tiny muted" style="margin-top:6px">Réinitialiser efface les statuts, ajustements et déplacements du plan. Ton journal, tes courses et tes records sont conservés.</p>
      <div class="section-title"><h2>Zones</h2></div>
      <p class="small muted">VDOT ${v.vdot} · ${v.source}</p>
      <div class="field" style="margin-top:8px"><div class="seg"><button class="${p.zonesMode==='auto'?'on':''}" onclick="Data.state.profile.zonesMode='auto';Data.save();UI.openSettings()">Automatiques (VDOT)</button><button class="${p.zonesMode==='manual'?'on':''}" onclick="Data.state.profile.zonesMode='manual';Data.save();UI.openSettings()">Manuelles</button></div></div>
      ${p.zonesMode==='manual'?`<table class="pr"><tr><th>Zone</th><th>Lent</th><th>Rapide</th></tr>${['E','M','T','I'].map(k=>`<tr><td><span class="pill z ${k}">${k}</span></td><td>${zi(k,0)}</td><td>${zi(k,1)}</td></tr>`).join('')}</table>`
        : `<table class="pr">${['E','M','T','I'].map(k=>`<tr><td><span class="pill z ${k}">${k}</span> ${Physio.zoneName[k]}</td><td class="r num">${Physio.zoneLabel(z,k).split(' ·')[0]}</td></tr>`).join('')}</table>`}
      <div class="field" style="margin-top:10px"><label>Fréquence cardiaque par zone (texte libre)</label><div class="grid2">${['E','M','T','I'].map(k=>`<input type="text" value="${Util.esc(p.hr[k])}" placeholder="${k}" onchange="Data.state.profile.hr['${k}']=this.value;Data.save()">`).join('')}</div></div>
      <div class="section-title"><h2>Affichage</h2></div>
      <div class="toggle"><span>Thème sombre</span><button class="switch ${p.theme!=='light'?'on':''}" onclick="Data.state.profile.theme=Data.state.profile.theme==='light'?'dark':'light';Data.save();UI.render();UI.openSettings()" aria-label="Thème"></button></div>
      <div class="toggle"><span>Unités</span><span class="muted">km (miles : prochaine version)</span></div>
      <div class="section-title"><h2>Sauvegarde</h2></div>
      <p class="small muted">Exporte un fichier JSON avant chaque mise à jour de l'app, et restaure-le au besoin. Rien n'est envoyé nulle part : tout reste sur cet appareil.</p>
      <div class="btnrow" style="margin-top:10px"><button class="btn primary" onclick="Data.exportJSON()">Exporter la sauvegarde</button><button class="btn" onclick="document.getElementById('importFile').click()">Restaurer</button></div>
      <p class="tiny muted" style="margin-top:14px">Coach Course v${APP_VERSION} · schéma v${Data.state.schemaVersion} · ${Data.state.activities.length} séances, ${Data.state.races.length} courses, ${Data.state.records.length} chronos. Données locales (localStorage).</p>
      <button class="btn sm danger" style="margin-top:10px" onclick="UI.resetAll()">Réinitialiser l'app</button>`); },
  toggleDay(d){ const p = Data.state.profile; if(p.availableDays.includes(d)){ if(p.availableDays.length<=2){ UI.toast('Minimum 2 jours'); return; } p.availableDays = p.availableDays.filter(x=>x!==d); } else p.availableDays.push(d); Data.save(); UI.openSettings(); },
  setManualZone(k,i,val){ const s = Util.parseTime(val); if(s){ Data.state.profile.manualZones[k][i] = s; Data.save(); } },
  resetAll(){ if(!confirm('Effacer toutes les données de cet appareil ? Exporte une sauvegarde d\'abord.')) return; if(!confirm('Vraiment ? Cette action est irréversible.')) return; localStorage.removeItem(STORAGE_KEY); location.reload(); },
});

/* ---- Glisser-déposer des séances (écran Plan) : prendre la poignée ⋮⋮ et glisser sur un autre jour ---- */
const Dnd = {
  src:null, ghost:null, over:null, active:false, pid:null, dx:0, dy:0,
  init(){ const m = document.getElementById('main');
    m.addEventListener('pointerdown', e => Dnd.start(e));
    m.addEventListener('pointermove', e => Dnd.move(e));
    m.addEventListener('pointerup', e => Dnd.end(e));
    m.addEventListener('pointercancel', () => Dnd.cancel());
    m.addEventListener('click', e => { if(e.target.closest && e.target.closest('.grip')){ e.preventDefault(); e.stopPropagation(); } }, true); },
  start(e){ const grip = e.target.closest && e.target.closest('.grip'); if(!grip) return; e.preventDefault();
    const row = grip.closest('.sess'); if(!row) return; Dnd.cancel(); Dnd.src = row; Dnd.pid = e.pointerId; Dnd.active = true; document.body.classList.add('dragging');
    try{ grip.setPointerCapture(e.pointerId); }catch(_){}
    if(navigator.vibrate) navigator.vibrate(10);
    const r = row.getBoundingClientRect(); const g = row.cloneNode(true); g.classList.add('ghost'); g.style.width = r.width+'px'; g.style.left = r.left+'px'; g.style.top = r.top+'px';
    document.body.appendChild(g); Dnd.ghost = g; Dnd.dx = e.clientX - r.left; Dnd.dy = e.clientY - r.top; row.classList.add('lifting'); },
  move(e){ if(!Dnd.active || e.pointerId!==Dnd.pid) return; e.preventDefault();
    Dnd.ghost.style.left = (e.clientX - Dnd.dx)+'px'; Dnd.ghost.style.top = (e.clientY - Dnd.dy)+'px';
    const under = document.elementFromPoint(e.clientX, e.clientY); const day = under && under.closest ? under.closest('.day') : null;
    if(day !== Dnd.over){ if(Dnd.over) Dnd.over.classList.remove('drop'); Dnd.over = null; if(day && day.dataset.date !== Dnd.src.dataset.date){ Dnd.over = day; day.classList.add('drop'); } }
    const vh = window.innerHeight; if(e.clientY < 120) window.scrollBy(0, -10); else if(e.clientY > vh - 120) window.scrollBy(0, 10); },
  end(e){ if(!Dnd.active || e.pointerId!==Dnd.pid) return;
    const from = Dnd.src.dataset.date, slot = Dnd.src.querySelector('.grip').dataset.slot, to = Dnd.over ? Dnd.over.dataset.date : null; Dnd.cancel();
    if(to && to !== from){ Plan.swap(from, to, slot); UI.render(); UI.toast(slot==='renfo' ? 'Renforcement déplacé' : 'Séances échangées'); } },
  cancel(){ if(Dnd.ghost){ Dnd.ghost.remove(); Dnd.ghost = null; } if(Dnd.src) Dnd.src.classList.remove('lifting'); if(Dnd.over) Dnd.over.classList.remove('drop'); Dnd.over = null; Dnd.src = null; Dnd.active = false; Dnd.pid = null; document.body.classList.remove('dragging'); },
};

/* ============================== 10. DÉMARRAGE =========================== */
(function boot(){
  Data.load();
  // Manifest et icône générés à la volée (mode standalone sur iPhone via « Ajouter à l'écran d'accueil »)
  try{ const cv = document.createElement('canvas'); cv.width = cv.height = 180; const g = cv.getContext('2d');
    g.fillStyle = '#0E1512'; g.fillRect(0,0,180,180); g.strokeStyle = '#F2B84B'; g.lineWidth = 14; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(30,125); g.lineTo(70,70); g.lineTo(100,105); g.lineTo(150,45); g.stroke(); g.fillStyle = '#6FB7A3'; g.beginPath(); g.arc(150,45,12,0,Math.PI*2); g.fill();
    const icon = cv.toDataURL('image/png'); document.getElementById('iconLink').href = icon;
    const manifest = { name:'Coach Course', short_name:'Coach', start_url:location.href.split('#')[0], display:'standalone', background_color:'#0E1512', theme_color:'#0E1512', lang:'fr-CA', icons:[{ src:icon, sizes:'180x180', type:'image/png' }] };
    document.getElementById('manifestLink').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'})); }catch(e){}
  UI.render(); Dnd.init();
  window.addEventListener('keydown', e => { if(e.key==='Escape') UI.closeSheet(); });
})();
</script>
