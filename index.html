<!DOCTYPE html>
<html lang="fr-CA" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Coach Course</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="theme-color" content="#0E1512">
<link rel="manifest" id="manifestLink" href="">
<link rel="apple-touch-icon" id="iconLink" href="">
<style>
/* ==========================================================================
   COACH COURSE — feuille de style
   Thème sombre « sous-bois » par défaut, thème clair disponible.
   ========================================================================== */
:root{
  --bg:#0E1512; --surface:#16201B; --surface2:#1E2A24; --line:#2A3A31;
  --text:#EEF0E9; --muted:#98A69D; --accent:#F2B84B; --accent-ink:#1A1200;
  /* Couleurs de zones (E endurance, M marathon/tempo, T seuil, I VO2max, R répétitions, C côtes, S renfo, X repos) */
  --zE:#6FB7A3; --zM:#D9B85A; --zT:#F08C3C; --zI:#E45B5B; --zR:#B287D8; --zC:#C9915B; --zS:#A8A0E8; --zX:#5F6E66;
  --vert:#5FCF80; --jaune:#F2C94C; --rouge:#EB5757;
  --radius:16px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{
  --bg:#F2F3EE; --surface:#FFFFFF; --surface2:#E8ECE6; --line:#D3D9D1;
  --text:#141A17; --muted:#5C6963; --accent:#B67714; --accent-ink:#FFFFFF;
  --zX:#A5B0A9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{
  font-family:-apple-system,"SF Pro Text","Helvetica Neue",Inter,Roboto,system-ui,sans-serif;
  font-size:16px;line-height:1.45;overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.15}
h1{font-size:28px}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
a{color:var(--accent)}

/* ---- Entête et navigation ---- */
header.top{
  position:fixed;top:0;left:0;right:0;z-index:20;
  padding:calc(var(--sat) + 10px) 18px 10px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
header.top .brand{display:flex;align-items:baseline;gap:8px}
header.top .brand h1{font-size:18px}
header.top .brand .ver{font-size:11px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--text)}
.iconbtn:active{opacity:.7}
.light-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.vert{background:var(--vert)} .dot.jaune{background:var(--jaune)} .dot.rouge{background:var(--rouge)}

main{
  padding:calc(var(--sat) + 68px) 16px calc(var(--sab) + 96px);
  max-width:640px;margin:0 auto;
}
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:flex;justify-content:space-around;
  padding:8px 8px calc(var(--sab) + 8px);
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
nav.tabs button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:600;
}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

/* ---- Blocs de contenu ---- */
.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card.flat{background:transparent;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface2);border-radius:12px;padding:12px}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 10px}
.section-title h2{font-size:17px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--text)}
.pill.z{color:#0d0d0d}
.pill.E{background:var(--zE)} .pill.M{background:var(--zM)} .pill.T{background:var(--zT)} .pill.I{background:var(--zI);color:#fff}
.pill.R{background:var(--zR)} .pill.C{background:var(--zC)} .pill.S{background:var(--zS)} .pill.X{background:var(--zX);color:#fff}
.pill.A{background:var(--accent);color:var(--accent-ink)} .pill.B{background:var(--zM);color:#111} .pill.Cprio{background:var(--surface2)}

/* Bouton principal */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--surface2);color:var(--text);width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:color-mix(in srgb,var(--rouge) 22%,var(--surface));color:var(--rouge)}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;width:auto}
.btn:active{transform:scale(.98)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1;width:auto}

/* ---- Carte « Aujourd'hui » (élément signature) ---- */
.today{padding:18px;border-radius:20px;background:linear-gradient(160deg,var(--surface) 0%,var(--surface2) 100%);margin-bottom:14px}
.today .kicker{font-size:13px;color:var(--muted)}
.today h2{font-size:26px;margin:4px 0 6px}
.today .intent{color:var(--muted);font-size:14px}
.ribbon{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px;margin:14px 0 6px}
.ribbon i{display:block;height:100%;border-radius:2px;opacity:.95;min-width:2px}
.ribbon i.E{background:var(--zE)} .ribbon i.M{background:var(--zM)} .ribbon i.T{background:var(--zT)} .ribbon i.I{background:var(--zI)}
.ribbon i.R{background:var(--zR)} .ribbon i.C{background:var(--zC)} .ribbon i.S{background:var(--zS)} .ribbon i.X{background:var(--zX)} .ribbon i.W{background:var(--zX);opacity:.6}
.ribbon.mini{height:10px;margin:8px 0 0}
.today .meta{display:flex;gap:14px;font-size:14px}
.today .meta b{font-weight:700}

/* ---- Semaine (plan) ---- */
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.weeknav .iconbtn{width:44px;height:44px}
.weeknav .title{text-align:center}
.weeknav .title b{display:block;font-size:17px}
.weeknav .title span{font-size:13px;color:var(--muted)}
.day{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .d{width:44px;flex:none;text-align:center}
.day .d b{display:block;font-size:12px;color:var(--muted);text-transform:none}
.day .d span{display:block;font-size:20px;font-weight:700;line-height:1.1}
.day.today .d span{color:var(--accent)}
.day .body{flex:1;min-width:0}
.sess{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface2);margin-bottom:6px}
.sess:last-child{margin-bottom:0}
.sess{position:relative}
.sess.drag{padding-right:44px}
.grip{position:absolute;right:0;top:0;bottom:0;width:44px;display:grid;place-items:center;color:var(--muted);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.grip svg{width:14px;height:20px;fill:currentColor}
.sess.lifting{opacity:.35}
.ghost{position:fixed;z-index:70;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.45);transform:scale(1.03);opacity:.95;margin:0;background:var(--surface2)}
.day.drop{background:color-mix(in srgb,var(--accent) 18%,transparent);border-radius:12px}
body.dragging{-webkit-user-select:none;user-select:none}
.sess .sw{width:6px;align-self:stretch;border-radius:3px;flex:none}
.sess .sw.E{background:var(--zE)} .sess .sw.M{background:var(--zM)} .sess .sw.T{background:var(--zT)} .sess .sw.I{background:var(--zI)}
.sess .sw.R{background:var(--zR)} .sess .sw.C{background:var(--zC)} .sess .sw.S{background:var(--zS)} .sess .sw.X{background:var(--zX)}
.sess .t{flex:1;min-width:0}
.sess .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .t span{font-size:13px;color:var(--muted)}
.sess .st{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;flex:none}
.st.done{background:color-mix(in srgb,var(--vert) 25%,transparent);color:var(--vert)}
.st.modified{background:color-mix(in srgb,var(--jaune) 25%,transparent);color:var(--jaune)}
.st.skipped{background:color-mix(in srgb,var(--rouge) 22%,transparent);color:var(--rouge)}
.sess.done .t b{text-decoration:none;opacity:.75}
.notice{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));font-size:14px;margin-bottom:12px}
.notice.jaune{background:color-mix(in srgb,var(--jaune) 16%,var(--surface))}
.notice.rouge{background:color-mix(in srgb,var(--rouge) 16%,var(--surface))}

/* ---- Étapes de séance (format Garmin) ---- */
.steps{counter-reset:step;margin:12px 0}
.step{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .n{counter-increment:step;width:26px;height:26px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.step .n::before{content:counter(step)}
.step .b{flex:1}
.step .b b{display:block;font-size:15px}
.step .b .tg{font-size:13px;color:var(--muted)}
.step .sub{margin-top:6px;padding-left:10px;border-left:2px solid var(--line);font-size:14px}
.step .sub div{padding:3px 0}
.how{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}

/* ---- Fiches d'exercice (renforcement) ---- */
.ex{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .pic{width:56px;height:56px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;flex:none}
.ex .pic svg{width:44px;height:44px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ex .b{flex:1;min-width:0}
.ex .b b{display:block;font-size:15px}
.ex .b .tg{font-size:13px;color:var(--muted)}
.ex .b a{display:inline-block;margin-top:5px;font-size:13px;font-weight:600}
.exlinks{display:flex;gap:14px;flex-wrap:wrap}

/* ---- Listes, formulaires ---- */
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.list .item .t{flex:1;min-width:0}
.list .item .t b{display:block}
.list .item .t span{font-size:13px;color:var(--muted)}
.list .item .r{text-align:right;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{
  width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:16px;
}
.field textarea{min-height:80px;resize:vertical}
.field input[type=range]{padding:0;min-height:32px;border:0;background:transparent}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip.on.vert{background:var(--vert);color:#062}
.chip.on.jaune{background:var(--jaune);color:#4a3600}
.chip.on.rouge{background:var(--rouge);color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.switch{width:50px;height:30px;border-radius:15px;background:var(--surface2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px);background:var(--accent-ink)}

/* ---- Feuille modale (bas d'écran) ---- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:14px 18px calc(var(--sab) + 20px);transform:translateY(100%);transition:transform .25s ease}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin-bottom:12px}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}

/* ---- Graphiques ---- */
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;margin:10px 0 4px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars .b i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--zE);min-height:2px}
.bars .b.cur i{background:var(--accent)}
.bars .b.plan i{background:transparent;border:1.5px dashed var(--muted)}
.bars .b span{font-size:10px;color:var(--muted);margin-top:4px}
.zbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0}
.zbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* ---- Accordéon ---- */
details{border-bottom:1px solid var(--line);padding:10px 0}
details:last-child{border-bottom:0}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:32px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-weight:400;font-size:20px}
details[open] summary::after{content:"–"}
details .body{padding:8px 0 4px;font-size:14px;color:var(--text)}
details .body p{margin-bottom:8px}
ul.clean{margin:0;padding-left:18px}
ul.clean li{margin:4px 0}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}
.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 100px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
table.pr{width:100%;border-collapse:collapse;font-size:14px}
table.pr td,table.pr th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.pr th{font-size:12px;color:var(--muted);font-weight:600}
table.pr td.r{text-align:right}
.phaseline{display:flex;gap:3px;height:8px;border-radius:4px;overflow:hidden;margin:10px 0 6px}
.phaseline i{display:block;height:100%}
.ph-base{background:var(--zE)} .ph-dev{background:var(--zM)} .ph-spec{background:var(--zT)} .ph-taper{background:var(--zR)} .ph-recup{background:var(--zX)}
.phaseline i.cur{outline:2px solid var(--text);outline-offset:-2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- Responsive ---- */
img,svg,video{max-width:100%}
.sheet a{word-break:break-word}
input,select,textarea{max-width:100%}
@media(max-width:374px){
  .grid3{gap:6px}
  .stat{padding:10px 8px}
  .stat .v{font-size:19px}
  .grid2{grid-template-columns:1fr}
  .grid2.keep{grid-template-columns:1fr 1fr}
  main{padding-left:12px;padding-right:12px}
}
@media(min-width:760px){ main{max-width:720px} .sheet{max-width:640px;left:50%;transform:translate(-50%,100%);border-radius:22px 22px 0 0} .sheet.on{transform:translate(-50%,0)} }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Coach Course</h1><span class="ver" id="verLabel"></span></div>
  <div class="row">
    <button class="light-chip" id="lightChip" onclick="UI.openTrafficLight()" aria-label="Protocole feu de circulation"></button>
    <button class="iconbtn" onclick="UI.openSettings()" aria-label="Réglages">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main id="main"></main>

<nav class="tabs" id="tabs"></nav>

<div class="sheet-bg" id="sheetBg" onclick="UI.closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="Data.importFromFile(this)">

<script>
/* ==========================================================================
   COACH COURSE — application autonome (aucune dépendance externe)
   Modules :
     1. Util        — utilitaires (dates, formats, identifiants)
     2. Data        — état, schéma versionné, migrations, persistance, sauvegarde
     3. Physio      — VDOT (Jack Daniels), zones, prédictions
     4. Lib         — bibliothèque de séances de course (format Garmin)
     5. Strength    — renforcement (Renfo 1/2/3, gainage, mobilité)
     6. Plan        — moteur de plan périodisé et adaptatif
     7. Stats       — tableau de bord, charge, zones
     8. Coach       — contenu de coaching, check-list pré-course
     9. UI          — écrans, feuilles modales, formulaires
    10. Démarrage
   ========================================================================== */
'use strict';
const APP_VERSION = '1.4.0';
const SCHEMA_VERSION = 4;
const STORAGE_KEY = 'coachCourse';

/* ============================== 1. UTIL ================================= */
const Util = {
  uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); },
  today(){ const d = new Date(); d.setHours(0,0,0,0); return d; },
  iso(d){ const x = new Date(d); x.setHours(0,0,0,0); const m = String(x.getMonth()+1).padStart(2,'0'); const j = String(x.getDate()).padStart(2,'0'); return `${x.getFullYear()}-${m}-${j}`; },
  parse(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); },
  addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; },
  daysBetween(a,b){ return Math.round((Util.parse(Util.iso(b)) - Util.parse(Util.iso(a))) / 86400000); },
  monday(d){ const x = new Date(d); x.setHours(0,0,0,0); const dow = (x.getDay()+6)%7; x.setDate(x.getDate()-dow); return x; },
  dowShort:['dim','lun','mar','mer','jeu','ven','sam'],
  dowLong:['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'],
  months:['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'],
  fmtDate(iso, withYear){ const d = Util.parse(iso); return `${d.getDate()} ${Util.months[d.getMonth()]}${withYear?' '+d.getFullYear():''}`; },
  fmtDateLong(iso){ const d = Util.parse(iso); return `${Util.dowLong[d.getDay()]} ${d.getDate()} ${Util.months[d.getMonth()]}`; },
  fmtTime(sec){ if(sec==null||isNaN(sec)) return '—'; sec = Math.round(sec); const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
    return h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`; },
  fmtDur(min){ if(min==null||isNaN(min)) return '—'; min = Math.round(min); const h = Math.floor(min/60), m = min%60; return h>0 ? `${h} h ${String(m).padStart(2,'0')}` : `${m} min`; },
  fmtPace(secKm){ if(!secKm||!isFinite(secKm)) return '—'; secKm = Math.round(secKm); const m = Math.floor(secKm/60), s = secKm%60; return `${m}:${String(s).padStart(2,'0')}`; },
  parseTime(str){ if(!str) return null; str = String(str).trim().replace(/[.,hH]/g,':').replace(/[mM]/g,':').replace(/[sS]/g,'');
    if(/^\d+$/.test(str) && str.length>2){ str = str.length>4 ? str.slice(0,-4)+':'+str.slice(-4,-2)+':'+str.slice(-2) : str.slice(0,-2)+':'+str.slice(-2); }
    const p = str.split(':').filter(x=>x!=='').map(Number); if(p.some(isNaN)) return null;
    if(p.length===3) return p[0]*3600+p[1]*60+p[2]; if(p.length===2) return p[0]*60+p[1]; return p[0]; },
  km(n){ return (Math.round(n*10)/10).toLocaleString('fr-CA',{minimumFractionDigits:0,maximumFractionDigits:1}); },
  esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  clamp(v,a,b){ return Math.max(a, Math.min(b, v)); },
  weekLabel(monday){ const sun = Util.addDays(monday,6); const a = Util.fmtDate(Util.iso(monday)), b = Util.fmtDate(Util.iso(sun)); return `${a} – ${b}`; },
};

/* ============================== 2. DATA ================================= */
/* Modèle de données (schemaVersion 1)
   state = {
     schemaVersion, appVersion, createdAt,
     profile: { name, vdot, vdotSource, weeklyVolume, maxVolume, availableDays[], gymPref, units, theme,
                zonesMode, manualZones{E,M,T,I:[lent,rapide] en s/km}, hr{E,M,T,I}, trafficLight, trafficNote,
                planStart (lundi ISO), planRaceId, targetRaceId (v4 : course cible choisie dans « Nouveau plan », null = automatique) },
     races[]:      { id, name, date, distanceKm, type, elevation, goalTime(s), priority, location, notes,
                     result:{ time, rank, feel, learnings, date } | null },
     records[]:    { id, distanceKey, time(s), date, label, raceId },
     activities[]: { id, date, type, distance, duration(s), hrAvg, elevation, feel, pain, notes, weather, plannedKey },
     plan: { status:{ 'AAAA-MM-JJ:run'|'AAAA-MM-JJ:renfo': 'done'|'modified'|'skipped' },
             adjust:{ 'lundiISO': { mode:'skipped'|'jaune'|'rouge'|'fatigue'|'voyage', day } },
             checklist:{ raceId:{ itemKey:true } },
             overrides:{ 'AAAA-MM-JJ:run': { kind:'replace', type, km, note } }   (v2)
             moves:{ 'lundiISO': { 'AAAA-MM-JJ:run'|'AAAA-MM-JJ:renfo': 'AAAA-MM-JJ' (jour d'origine de la séance affichée) } }   (v3) }
   }
*/
const Data = {
  state: null,

  defaultProfile(){
    return {
      name:'Sébastien', vdot:43, vdotSource:'5 km en 22:43 (15 mai 2026)',
      weeklyVolume:40, maxVolume:60, availableDays:[1,2,4,6,0], gymPref:'maison', units:'km', theme:'dark',
      zonesMode:'auto', manualZones:{E:[380,350],M:[320,305],T:[305,295],I:[275,262]},
      hr:{E:'< 150', M:'150–165', T:'170–176', I:'> 176'},
      trafficLight:'vert', trafficNote:'',
      planStart:null, planRaceId:null, targetRaceId:null,
    };
  },

  seed(){
    const P = Data.defaultProfile();
    const races = [
      { id:'r5k', name:'5 km (test)', date:'2026-05-15', distanceKm:5, type:'route', elevation:0, goalTime:null, priority:'C', location:'', notes:'Chrono de référence pour le VDOT',
        result:{ time:Util.parseTime('22:43'), rank:'', feel:8, learnings:'', date:'2026-05-15' } },
      { id:'ott26', name:"Marathon d'Ottawa", date:'2026-05-24', distanceKm:42.2, type:'route', elevation:150, goalTime:null, priority:'A', location:'Ottawa',
        notes:'', result:{ time:Util.parseTime('4:30:00'), rank:'', feel:6, learnings:'', date:'2026-05-24' } },
      { id:'bor26', name:'Boréalys Diable 20K', date:'2026-08-15', distanceKm:20, type:'trail', elevation:1000, goalTime:null, priority:'A', location:'Mont-Tremblant',
        notes:"Première vraie course de trail. Ce qui a accroché : la gestion de la nutrition et de l'hydratation en course.", result:null },
      { id:'adk26', name:'Demi-marathon des Adirondacks', date:'2026-09-27', distanceKm:21.1, type:'route', elevation:200, goalTime:Util.parseTime('1:45:00'), priority:'A', location:'Schroon Lake, NY',
        notes:'Dernière course de la saison 2026.', result:null },
      { id:'mtl27', name:'10K de Montréal', date:'2027-04-18', distanceKm:10, type:'route', elevation:80, goalTime:null, priority:'B', location:'Montréal', notes:'Date à confirmer', result:null },
      { id:'ott27', name:"Marathon d'Ottawa — la revanche", date:'2027-05-30', distanceKm:42.2, type:'route', elevation:150, goalTime:null, priority:'A', location:'Ottawa', notes:'Date à confirmer', result:null },
      { id:'bor27', name:'Boréalys 50K', date:'2027-08-14', distanceKm:50, type:'trail', elevation:2500, goalTime:null, priority:'A', location:'Mont-Tremblant', notes:'Date à confirmer', result:null },
      { id:'uthc27', name:'UTHC 65K', date:'2027-09-11', distanceKm:65, type:'trail', elevation:3000, goalTime:null, priority:'B', location:'Charlevoix', notes:'Date à confirmer', result:null },
      { id:'bor28', name:'Boréalys 100K (Odyssée)', date:'2028-08-12', distanceKm:100, type:'trail', elevation:5000, goalTime:null, priority:'A', location:'Mont-Tremblant', notes:'Objectif 2028 — date à confirmer', result:null },
    ];
    const records = [
      { id:Util.uid(), distanceKey:'5K', time:Util.parseTime('22:43'), date:'2026-05-15', label:'5 km (test)', raceId:'r5k' },
      { id:Util.uid(), distanceKey:'42.2K', time:Util.parseTime('4:30:00'), date:'2026-05-24', label:"Marathon d'Ottawa", raceId:'ott26' },
    ];
    return { schemaVersion:SCHEMA_VERSION, appVersion:APP_VERSION, createdAt:Util.iso(Util.today()),
      profile:P, races, records, activities:[], plan:{ status:{}, adjust:{}, checklist:{}, overrides:{}, moves:{} } };
  },

  /* Migration : chaque version ajoute son bloc. On ne supprime jamais de données. */
  migrate(s){
    if(!s || typeof s!=='object') return Data.seed();
    let v = s.schemaVersion || 0;
    if(v < 1){
      // v0 → v1 : structure initiale — on complète les champs manquants sans rien écraser
      s.profile = Object.assign(Data.defaultProfile(), s.profile||{});
      s.races = s.races||[]; s.records = s.records||[]; s.activities = s.activities||[];
      s.plan = Object.assign({status:{},adjust:{},checklist:{},overrides:{},moves:{}}, s.plan||{});
      v = 1;
    }
    if(v < 2){
      // v1 → v2 : séances modifiées par l'utilisateur (remplacement / échange de jour). Rien d'existant n'est touché.
      s.plan.overrides = s.plan.overrides || {};
      v = 2;
    }
    if(v < 3){
      // v2 → v3 : déplacements de séances (glisser-déposer) stockés par semaine. Les anciens échanges sont convertis, rien n'est perdu.
      s.plan.moves = s.plan.moves || {}; const ov = s.plan.overrides || {};
      for(const key of Object.keys(ov)){ const o = ov[key]; if(o && o.kind==='swap'){ const a = key.split(':')[0], b = o.with; const m = Util.iso(Util.monday(Util.parse(a)));
          const wk = s.plan.moves[m] = s.plan.moves[m] || {}; const sa = wk[a+':run']||a, sb = wk[b+':run']||b; wk[a+':run'] = sb; wk[b+':run'] = sa; delete ov[key]; } }
      v = 3;
    }
    if(v < 4){
      // v3 → v4 : course cible choisie par l'utilisateur (assistant « Nouveau plan »). Simple ajout de champ, rien n'est perdu.
      s.profile.targetRaceId = s.profile.targetRaceId || null;
      v = 4;
    }
    // Futur : if(v < 5){ ... v = 5; }
    s.schemaVersion = v; s.appVersion = APP_VERSION;
    // Sécurité : champs de profil ajoutés dans une version ultérieure
    s.profile = Object.assign(Data.defaultProfile(), s.profile);
    return s;
  },

  load(){
    let raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
    if(raw){ try{ Data.state = Data.migrate(JSON.parse(raw)); }catch(e){ console.error('Données illisibles, sauvegarde de sécurité', e); try{ localStorage.setItem(STORAGE_KEY+'.corrompu.'+Date.now(), raw); }catch(_){} Data.state = Data.seed(); } }
    else Data.state = Data.seed();
    Data.ensurePlanAnchor();
    Data.save();
  },
  save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(Data.state)); }catch(e){ UI.toast('Sauvegarde impossible (stockage plein ?)'); } },

  /* Ancre du plan : le lundi de départ reste fixe tant que la course A ne change pas,
     pour que les phases ne glissent pas d'une semaine à l'autre. */
  ensurePlanAnchor(){
    const p = Data.state.profile;
    // La course cible choisie dans « Nouveau plan » redevient automatique si elle est passée ou supprimée
    if(p.targetRaceId){ const tr = Data.state.races.find(r => r.id===p.targetRaceId); if(!tr || tr.date < Util.iso(Util.today())) p.targetRaceId = null; }
    // v1.4 : le départ de saison reste fixe — les blocs s'enchaînent d'eux-mêmes de course en course (Plan.season)
    if(!p.planStart) p.planStart = Util.iso(Util.monday(Util.today()));
    const A = Plan.raceA(); p.planRaceId = A ? A.id : null;
  },

  exportJSON(){
    const blob = new Blob([JSON.stringify(Data.state, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `coach-course-sauvegarde-${Util.iso(Util.today())}.json`; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    UI.toast('Sauvegarde téléchargée');
  },
  importFromFile(input){
    const f = input.files && input.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => { try{ const obj = JSON.parse(rd.result); if(!obj.profile || !Array.isArray(obj.races)) throw new Error('format');
        if(!confirm('Restaurer cette sauvegarde ? Les données actuelles seront remplacées par celles du fichier.')) return;
        Data.state = Data.migrate(obj); Data.ensurePlanAnchor(); Data.save(); UI.closeSheet(); UI.render(); UI.toast('Sauvegarde restaurée'); }
      catch(e){ UI.toast('Fichier invalide'); } input.value=''; };
    rd.readAsText(f);
  },
};

/* ============================== 3. PHYSIO =============================== */
/* Formules de Jack Daniels (VDOT). v en m/min, t en minutes. */
const Physio = {
  vdotFrom(distM, timeSec){ const t = timeSec/60, v = distM/t;
    const vo2 = -4.6 + 0.182258*v + 0.000104*v*v;
    const pct = 0.8 + 0.1894393*Math.exp(-0.012778*t) + 0.2989558*Math.exp(-0.1932605*t);
    return vo2/pct; },
  velAt(vo2){ return (-0.182258 + Math.sqrt(0.182258**2 + 4*0.000104*(4.6+vo2))) / (2*0.000104); },
  paceAtPct(vdot, pct){ return 60000/Physio.velAt(vdot*pct); }, // s/km
  predict(vdot, distM){ let lo=3, hi=2400; for(let i=0;i<60;i++){ const mid=(lo+hi)/2; if(Physio.vdotFrom(distM, mid*60) > vdot) lo=mid; else hi=mid; } return lo*60; },
  /* Équivalent trail : + terrain (×1,12) + 1 km-effort par 100 m D+ */
  predictTrail(vdot, distKm, elev){ const flat = Physio.predict(vdot, distKm*1000); const perKm = flat/distKm; return flat*1.12 + (elev/100)*perKm*1.05; },

  /* VDOT courant : meilleur VDOT parmi les records récents (18 mois), sinon profil */
  currentVdot(){ const p = Data.state.profile; let best = 0, src = '';
    const lim = Util.iso(Util.addDays(Util.today(), -548));
    for(const r of Data.state.records){ const d = Physio.distOf(r.distanceKey); if(!d || r.date < lim || !r.time) continue;
      if(r.distanceKey.endsWith('T')) continue; // records trail non utilisés pour le VDOT
      const v = Physio.vdotFrom(d*1000, r.time); if(v > best){ best = v; src = `${r.distanceKey} en ${Util.fmtTime(r.time)} (${Util.fmtDate(r.date, true)})`; } }
    return best>0 ? { vdot: Math.round(best*10)/10, source:src } : { vdot:p.vdot, source:p.vdotSource };
  },
  distOf(key){ return ({'5K':5,'10K':10,'21.1K':21.1,'42.2K':42.2,'20KT':20,'50KT':50,'65KT':65,'100KT':100})[key] || parseFloat(key) || null; },
  distanceKey(km, type){ const keys = type==='trail' ? [[20,'20KT'],[50,'50KT'],[65,'65KT'],[100,'100KT']] : [[5,'5K'],[10,'10K'],[21.1,'21.1K'],[42.2,'42.2K']];
    for(const [d,k] of keys){ if(Math.abs(km-d) <= d*0.05) return k; } return `${km}K${type==='trail'?'T':''}`; },

  zones(){ const p = Data.state.profile; const V = Physio.currentVdot().vdot;
    let z;
    if(p.zonesMode==='manual') z = JSON.parse(JSON.stringify(p.manualZones));
    else z = { E:[Physio.paceAtPct(V,0.62), Physio.paceAtPct(V,0.72)], M:[Physio.paceAtPct(V,0.79), Physio.paceAtPct(V,0.83)],
               T:[Physio.paceAtPct(V,0.83), Physio.paceAtPct(V,0.88)], I:[Physio.paceAtPct(V,0.96), Physio.paceAtPct(V,1.01)] };
    z.R = [z.I[1]-18, z.I[1]-30]; z.vdot = V; z.hr = p.hr; return z; },
  zoneLabel(z, key){ const r = z[key]; if(!r) return ''; const hr = z.hr && z.hr[key] ? ` · FC ${z.hr[key]}` : '';
    return `${Util.fmtPace(r[0])}–${Util.fmtPace(r[1])}/km${hr}`; },
  zoneMid(z, key){ if(key==='W') return 600; if(key==='X') return 420; if(key==='C') return z.T[0]+60; const r = z[key]; return r ? (r[0]+r[1])/2 : 360; },
  zoneName:{E:'Endurance',M:'Allure marathon / tempo',T:'Seuil',I:'VO2max',R:'Répétitions',C:'Côte',S:'Renforcement',X:'Repos / récup',W:'Marche'},
};

/* ============================== 4. LIB (séances) ======================== */
/* Une étape : { label, min|km|m, z }  ·  Une répétition : { label, reps, parts:[étapes] }
   z = zone (E, M, T, I, R, C côte, W marche, X repos, AC allure course cible). */
const Lib = {
  /* Références YouTube en français : titre ou créateur à chercher, jamais d'URL inventée. */
  yt:{
    endurance:'Chercher « endurance fondamentale » sur la chaîne Running Addict',
    tempo:'Chercher « séance tempo allure marathon » sur Running Addict',
    seuil:'Chercher « seuil lactique comment s\'entraîner » sur Running Addict ou Campus Coach',
    vo2:'Chercher « fractionné VO2max 30/30 et intervalles » sur Running Addict',
    fartlek:'Chercher « fartlek séance ludique » sur Running Addict',
    cotes:'Chercher « côtes courtes et côtes longues » sur Running Addict',
    progressif:'Chercher « sortie progressive » sur Campus Coach',
    longue:'Chercher « sortie longue marathon blocs allure » sur Running Addict',
    trail:'Chercher « montée en trail technique de marche et bâtons » sur Distances+ (Québec)',
    descente:'Chercher « technique de descente trail » sur Distances+ ou Mathieu Blanchard',
    ravito:'Chercher « nutrition et hydratation en ultra-trail » sur Distances+',
    renfo:'Chercher « renforcement musculaire coureur fessiers » sur Major Mouvement',
    excentrique:'Chercher « travail excentrique quadriceps descente trail » sur Major Mouvement',
    iso:'Chercher « isométrie tendon d\'Achille et rotulien » sur Major Mouvement',
    taper:'Chercher « affûtage avant une course » sur Running Addict',
  },
  /* Requêtes de recherche YouTube (liens cliquables — on pointe vers la recherche, jamais vers une URL inventée) */
  ytQ:{
    endurance:'endurance fondamentale courir lentement', tempo:'séance tempo allure marathon course à pied', seuil:'seuil lactique entraînement course à pied',
    vo2:'fractionné VO2max course à pied', fartlek:'fartlek séance course à pied', cotes:'séance de côtes course à pied', progressif:'sortie progressive course à pied',
    longue:'sortie longue marathon conseils', trail:'technique montée trail marche rapide', descente:'technique descente trail', ravito:'nutrition hydratation ultra trail',
    renfo:'renforcement musculaire coureur fessiers', excentrique:'travail excentrique quadriceps trail', iso:'exercices isométriques tendon coureur', taper:'affûtage avant une course',
  },
  ytLink(key){ const q = Lib.ytQ[key]; return q ? 'https://www.youtube.com/results?search_query='+encodeURIComponent(q) : null; },

  /* Explication automatique de chaque étape : comment faire, concrètement. */
  explain(st){ const L = (st.label||'').toLowerCase(); const out = [];
    if(L.includes('échauffement')) out.push('Pars très lentement : les 5 premières minutes doivent sembler trop faciles, puis monte doucement vers ton allure d’endurance.');
    if(L.includes('lignes droites')) out.push('Une ligne droite = accélération progressive de 15–20 s (environ 80–100 m) jusqu’à ~90 % de ta vitesse max, grande foulée relâchée — pas un sprint. Marche 40–60 s entre chaque.');
    else if(L.includes('accélération')) out.push('Monte en vitesse progressivement sur toute la longueur, épaules basses et mains souples : vite mais relâché, jamais un sprint.');
    if(L.includes('retour au calme')) out.push('Trot très lent, voire marche sur la fin : on fait redescendre la fréquence cardiaque et on commence la récupération.');
    const zTxt = {
      E:'Aisance totale : tu peux faire des phrases complètes. En cas de doute, ralentis.',
      M:'« Confortablement dur » : tu peux dire quelques mots, pas tenir une conversation.',
      T:'Respiration forte mais contrôlée — l’allure que tu tiendrais environ 1 h en course. 3–4 mots possibles, pas plus.',
      I:'Très soutenu (allure 3–5 km). Vise la régularité : la dernière répétition doit ressembler à la première.',
      R:'Vite et relâché : on travaille la technique et la vitesse de jambes, pas l’épuisement.',
      C:'En côte, gère à l’effort (souffle, FC), pas à l’allure : pousse avec les hanches, pas courts, regard 5 m devant.',
      W:'Marche vraiment : c’est une récupération utile, profite-en pour boire.',
      AC:'C’est l’allure exacte du jour J : mémorise la sensation et le rythme de respiration.',
    };
    if(st.z && zTxt[st.z] && !L.includes('échauffement') && !L.includes('retour au calme') && !L.includes('lignes droites') && !L.includes('accélération')) out.push(zTxt[st.z]);
    return out.join(' '); },

  /* Estimation km / minutes à partir des étapes et des zones */
  estimate(steps, z){ let km=0, min=0; const flat = st => st.reps ? Array(st.reps).fill(st.parts).flat() : [st];
    for(const st of steps.flatMap(flat)){ const pace = st.z==='AC' && z.AC ? z.AC : Physio.zoneMid(z, st.z||'E');
      if(st.min){ min += st.min; km += st.min*60/pace; } else if(st.km){ km += st.km; min += st.km*pace/60; } else if(st.m){ km += st.m/1000; min += st.m/1000*pace/60; } }
    return { km:Math.round(km*10)/10, min:Math.round(min) }; },

  make(o, z){ const e = Lib.estimate(o.steps, z); return Object.assign({ kind:'Q', km:e.km, min:e.min }, o); },
  /* Ajuste une séance de qualité au budget kilométrique de la semaine : échauffement/retour au calme plus courts, puis moins de répétitions */
  fit(s, budget, z){ if(!s.steps || s.km <= budget) return s; const wu = s.steps[0], cd = s.steps[s.steps.length-1];
    if(wu.min && wu.min > 10) wu.min = 10; if(cd.min && cd.min > 8) cd.min = 8; Object.assign(s, Lib.estimate(s.steps, z));
    if(s.km > budget*1.15){ for(const st of s.steps){ if(st.reps){ const nr = Math.max(2, Math.floor(st.reps*budget/s.km)); if(nr < st.reps){ s.title = s.title.replace(/\b(\d+) ×/, nr+' ×'); st.reps = nr; } }
        else if(st.km && st.z!=='E'){ const nk = Math.max(3, Math.round(st.km*budget/s.km)); if(nk < st.km){ s.title = s.title.replace(/(\d+) km continu/, nk+' km continu'); st.km = nk; } } } Object.assign(s, Lib.estimate(s.steps, z)); }
    return s; },
  pick(arr, i){ return arr[((i%arr.length)+arr.length)%arr.length]; },

  /* ---- Séances faciles ---- */
  endurance(km, i, z){ const strides = i%2===0;
    const steps = [{label:'Course facile, conversation possible', km:strides?km-1:km, z:'E'}];
    if(strides) steps.push({label:'Lignes droites (foulée relâchée, pas un sprint)', reps:6, parts:[{label:'Accélération', m:100, z:'R'},{label:'Marche / trot', m:100, z:'W'}]});

  /* ---- Sortie longue ---- */
  longue(km, i, z, ctx){ const trail = ctx.race && ctx.race.type==='trail'; const race = ctx.race;
    const variants = (ctx.phase==='recuperation' || ctx.phase==='affutage') ? ['simple','progressive'] : trail
      ? (ctx.phase==='base' ? ['simple','dplus','progressive','ravito'] : ['dplus','ravito','simple','dplus','progressive','ravito'])

    const v = Lib.pick(variants, i);
    if(v==='blocs'){ const bk = km>=18 ? 3 : 2; const nb = Util.clamp(Math.floor((km-6)/(bk+1)), 1, 3); const rest = km - nb*bk - nb*1;

        steps:[{label:'Très facile', km:Math.round(km*0.35), z:'E'},{label:'Endurance', km:Math.round(km*0.35), z:'E'},{label:'Endurance haute (haut de zone E)', km:km-Math.round(km*0.35)*2, z:'E'}] }, z); }

/* ============================== 6. PLAN ================================= */
const Plan = {
  dayOrder:[1,2,3,4,5,6,0],
  raceA(){ const t = Util.iso(Util.today());
    const tid = Data.state.profile.targetRaceId;
    if(tid){ const tr = Data.state.races.find(r => r.id===tid && r.date >= t); if(tr) return tr; }
    const up = Data.state.races.filter(r => r.date >= t).sort((a,b)=>a.date<b.date?-1:1);
    return up.find(r => r.priority==='A' || r.priority==='B') || up[0] || null; },
  racesInWeek(monday){ const a = Util.iso(monday), b = Util.iso(Util.addDays(monday,6)); return Data.state.races.filter(r => r.date>=a && r.date<=b); },

  /* ---- Saison (v1.4) : chaque course A ou B devient un bloc enchaîné.
     base → développement → spécifique → affûtage → course → récupération → bloc suivant.
     Les courses C restent des courses « de passage » gérées dans la semaine. ---- */
  season(){ const p = Data.state.profile; const start = Util.monday(Util.parse(p.planStart || Util.iso(Util.monday(Util.today()))));
    const targets = Data.state.races.filter(r => (r.priority==='A' || r.priority==='B') && Util.parse(r.date) >= start).sort((a,b)=>a.date<b.date?-1:1);
    const segs = []; let cursor = 0;
    for(const r of targets){ const rw = Math.round(Util.daysBetween(start, Util.monday(Util.parse(r.date)))/7);
      const prev = segs[segs.length-1];
      if(prev && rw <= prev.raceIdx) continue; // même semaine qu'une autre course cible : gérée comme course dans la semaine
      const sIdx = prev ? Math.min(cursor, rw) : 0; const N = rw - sIdx + 1;
      let taper = r.distanceKm>=40 ? 3 : r.distanceKm>=20 ? (N>=5 ? 2 : 1) : (N>=8 ? 2 : 1); taper = Math.min(taper, Math.max(0, N-1));
      const build = Math.max(0, N - taper); let base=0, dev=0;
      if(build > 8){ base = Math.round(build*0.4); dev = Math.round(build*0.3); } else if(build > 4){ dev = Math.floor(build/3); }
      const recov = r.distanceKm>=40 ? 2 : 1; // semaines de récupération après la course, avant le bloc suivant
      segs.push({ race:r, startIdx:sIdx, raceIdx:rw, N, taper, base, dev, build, recov });
      cursor = rw + 1 + recov; }
    return { start, segs }; },

  /* Contexte d'une semaine : dans quel bloc elle tombe, sa phase, et le bloc qui suit */
  contextAt(monday){ const se = Plan.season(); const idx = Math.round(Util.daysBetween(se.start, monday)/7);
    let seg = null, after = null, next = null;
    for(let i=0;i<se.segs.length;i++){ const s = se.segs[i];
      if(idx >= s.startIdx && idx <= s.raceIdx){ seg = s; after = se.segs[i+1] || null; break; }
      if(idx < s.startIdx){ next = s; break; } }
    if(seg){ const rel = idx - seg.startIdx; const c = { race:seg.race, N:seg.N, taper:seg.taper, base:seg.base, dev:seg.dev, build:seg.build, raceIdx:seg.N-1 };
      return { season:se, idx, rel, race:seg.race, c, phase:Plan.phaseOf(rel, c), next:after, inGap:false }; }
    if(next){ // entre deux blocs (récupération post-course) : on affiche déjà la prochaine course
      const c = { race:next.race, N:next.N, taper:next.taper, base:next.base, dev:next.dev, build:next.build, raceIdx:next.N-1 };
      return { season:se, idx, rel: idx - next.startIdx, race:next.race, c, phase:'recuperation', next:null, inGap:true }; }
    const last = se.segs[se.segs.length-1];
    return { season:se, idx, rel:0, race:null, c:{ race:null, N:0, taper:0, base:0, dev:0, build:0, raceIdx:-1 },
      phase: last && idx <= last.raceIdx + last.recov ? 'recuperation' : 'base', next:null, inGap:false }; },
  context(){ return Plan.contextAt(Util.monday(Util.today())).c; },
  phaseOf(idx, c){ if(!c.race) return 'base'; if(idx < 0) return 'recuperation'; if(idx > c.raceIdx) return 'recuperation';
    if(idx < c.base) return 'base'; if(idx < c.base + c.dev) return 'developpement'; if(idx < c.build) return 'specifique'; return 'affutage'; },
  phaseName:{ base:'Base', developpement:'Développement', specifique:'Spécifique', affutage:'Affûtage', recuperation:'Récupération' },
  phaseClass:{ base:'ph-base', developpement:'ph-dev', specifique:'ph-spec', affutage:'ph-taper', recuperation:'ph-recup' },

  weekInfo(monday){ const p = Data.state.profile; const ctx = Plan.contextAt(monday);
    const phase = ctx.phase; const buildPhase = ['base','developpement','specifique'].includes(phase);
    const recovery = buildPhase && ctx.rel >= 0 && ctx.rel % 4 === 3;
    // Croissance du volume : comptée sur toute la saison, à travers les blocs
    let grow = 0; const lim = Math.min(ctx.idx, 120);
    for(let i=0;i<lim;i++){ const c2 = Plan.contextAt(Util.addDays(ctx.season.start, i*7));
      if(['base','developpement','specifique'].includes(c2.phase) && !(c2.rel >= 0 && c2.rel % 4 === 3)) grow++; }
    let vol = Math.min(p.maxVolume, p.weeklyVolume * Math.pow(1.07, Math.min(grow, 14)));
    if(recovery) vol *= 0.75;
    if(phase==='affutage'){ const fromEnd = ctx.c.raceIdx - ctx.rel; vol = vol * (fromEnd===0 ? 0.45 : fromEnd===1 ? 0.7 : 0.85); }
    if(phase==='recuperation') vol = p.weeklyVolume*0.5;
    return { idx:ctx.idx, rel:ctx.rel, phase, recovery, volume:Math.round(vol),
      isRaceWeek: !!ctx.race && !ctx.inGap && ctx.rel===ctx.c.raceIdx, race:ctx.race, c:ctx.c,
      nextRace: ctx.next ? ctx.next.race : null, inGap:ctx.inGap }; },

  zonesCtx(race){ const z = Physio.zones(); if(race){ const goal = race.goalTime || (race.type==='trail' ? Physio.predictTrail(z.vdot, race.distanceKm, race.elevation) : Physio.predict(z.vdot, race.distanceKm*1000)); z.AC = goal/race.distanceKm; if(race.type==='trail') z.AC = Math.min(z.AC, z.M[0]); } else z.AC = z.M[0]; return z; },

  /* Construction d'une semaine complète */
  build(monday){ const st = Data.state; const p = st.profile; const info = Plan.weekInfo(monday); const race = info.race; const z = Plan.zonesCtx(race);
    const avail = Plan.dayOrder.filter(d => p.availableDays.includes(d)); const n = avail.length; const idx = info.idx;
    const adj = st.plan.adjust[Util.iso(monday)] || null; const mode = adj ? adj.mode : null;
    let vol = info.volume; if(mode==='jaune') vol = Math.round(vol*0.8); if(mode==='fatigue') vol = Math.round(vol*0.75);
    const trail = race && race.type==='trail';
    // Jours de la semaine
    const days = []; for(let i=0;i<7;i++){ const d = Util.addDays(monday,i); days.push({ date:Util.iso(d), dow:d.getDay(), run:null, strength:null, extra:null, avail:avail.includes(d.getDay()) }); }
    const byDow = dow => days.find(d => d.dow===dow);
    const availDays = avail.map(byDow);
    const notices = [];

    /* --- Sortie longue --- */
    const lp = { base:0.32, developpement:0.33, specifique:(race && race.distanceKm>=40 ? 0.42 : 0.35), affutage:0.3, recuperation:0.3 }[info.phase] + (n<=4 ? 0.05 : 0);
    // Double préparation : si une course plus longue suit ce bloc, la sortie longue reste développée pour elle (hors affûtage)
    const nextR = info.nextRace;
    const prepNext = !!(nextR && race && ['base','developpement'].includes(info.phase) && nextR.distanceKm > race.distanceKm);
    const capFor = km => km==null ? 22 : km<=10 ? 16 : km<=21.1 ? 22 : km<=42.2 ? 34 : 36;
    const cap = Math.max(capFor(race ? race.distanceKm : null), prepNext ? capFor(nextR.distanceKm) : 0);
    let longKm = Util.clamp(Math.round(vol*lp), 8, cap);
    /* --- Séances de qualité --- */
    let qIdx = n>=7 ? [1,4] : n===6 ? [1,3] : n===5 ? [1,2] : n===4 ? [0,1] : [0];
    const menus = { base:['cotesCourtes','fartlek','progressif','tempo','seuilContinu','cotesLongues'],
      developpement: trail ? ['cotesLongues','vo2','seuilFractionne','montees','fartlek','tempo'] : ['seuilFractionne','vo2','tempo','cotesLongues','seuilContinu','fartlek'],
      specifique: trail ? ['montees','descente','seuilFractionne','marcheRapide','vo2','cotesLongues'] : ['allureCourse','seuilFractionne','vo2','tempo','seuilContinu','allureCourse'],
      affutage:['sharpener'], recuperation:[] };
    const menu = menus[info.phase]; let qTypes = [];
    if(menu.length){ const a = menu[idx % menu.length]; let b = menu[(idx*2+3) % menu.length]; if(b===a) b = menu[(idx*2+4) % menu.length];
      qTypes = info.phase==='affutage' ? ['sharpener'] : info.phase==='base' ? [a, Lib.pick(['progressif','fartlek'], idx)] : [a,b]; }
    if(info.recovery) qTypes = qTypes.slice(0,1);
    if(mode==='jaune' || mode==='rouge') qTypes = [];
    if(mode==='fatigue' || mode==='voyage') qTypes = qTypes.slice(0,1);
    qIdx = qIdx.slice(0, qTypes.length);
    const gen = (t, i) => { const f = { cotesCourtes:()=>Lib.cotesCourtes(i,z), cotesLongues:()=>Lib.cotesLongues(i,z), fartlek:()=>Lib.fartlek(i,z), progressif:()=>Lib.progressif(Util.clamp(Math.round(vol*0.22),6,14), i, z),
      tempo:()=>Lib.tempo(i,z), seuilContinu:()=>Lib.seuilContinu(i,z), seuilFractionne:()=>Lib.seuilFractionne(i,z), vo2:()=>Lib.vo2(i,z), allureCourse:()=>Lib.allureCourse(i,z,race),
      sharpener:()=>Lib.sharpener(i,z), montees:()=>Lib.montees(i,z), descente:()=>Lib.descente(i,z), marcheRapide:()=>Lib.marcheRapide(i,z) }; return f[t] ? f[t]() : Lib.endurance(8,i,z); };

    /* --- Placement --- */
    const longDay = availDays[n-1];
    if(!info.isRaceWeek && longDay && mode!=='rouge'){ longDay.run = Lib.longue(mode==='jaune'||mode==='fatigue' ? Math.round(longKm*0.85) : longKm, idx, z, { race: prepNext ? nextR : race, phase:info.phase }); if(mode==='jaune'){ longDay.run = Lib.endurance(Math.round(longKm*0.8), idx, z); longDay.run.title = 'Sortie longue allégée'; longDay.run.kind='L'; } }
    const nE = Math.max(0, n - qTypes.length - 1); const budget = Math.max(8, (vol - longKm - nE*5) / Math.max(1, qTypes.length));
    let qKm = 0; qTypes.forEach((t,k) => { const d = availDays[qIdx[k]]; if(d && d!==longDay){ d.run = Lib.fit(gen(t, idx*2 + k), budget, z); qKm += d.run.km; } });
    if(info.isRaceWeek && race){ // semaine de course A : déverrouillage la veille, rappel de vitesse 3–4 jours avant, repos après
      const rd = days.find(d => d.date===race.date); if(rd){ rd.run = Lib.race(race, z); rd.avail = true; }
      days.forEach((d,i) => { if(d.date > race.date) d.run = Lib.rest('Récupération post-course. Marche, sommeil, nourriture.'); });
      const before = days.filter(d => d.date < race.date && d.avail);
      before.forEach((d,i) => { const gap = Util.daysBetween(Util.parse(d.date), Util.parse(race.date));
        if(gap===1) d.run = Lib.shakeout(z); else if(gap>=3 && gap<=4 && !before.some(x=>x.run && x.run.id==='sharpener')) d.run = Lib.fit(Lib.sharpener(idx, z), Math.max(7, vol/3), z); else d.run = Lib.endurance(gap>=5 ? Util.clamp(Math.round(vol/4),4,6) : 4, i, z); });
      qKm = 0;
    }
    /* Courses B/C dans la semaine */
    if(!info.isRaceWeek){ for(const r of Plan.racesInWeek(monday)){ const rd = days.find(d => d.date===r.date); if(!rd) continue;
      const wasLong = rd.run && rd.run.kind==='L'; rd.run = Lib.race(r, z); rd.avail = true;
      const prev = days.find(d => d.date===Util.iso(Util.addDays(Util.parse(r.date),-1))); if(prev && prev.avail) prev.run = Lib.shakeout(z);
      // une course = une séance de qualité ; on retire la 2e qualité et la sortie longue si la course est longue
      const qs = days.filter(d => d.run && d.run.kind==='Q' && d!==rd); if(qs.length>1) qs[qs.length-1].run = null;
      if(!wasLong && r.distanceKm>=10 && longDay && longDay.run && longDay!==rd) longDay.run = null;
      notices.push(`Course ${r.priority} cette semaine (${r.name}) : elle remplace une séance de qualité${r.distanceKm>=10?' et la sortie longue':''}.`); } }

    /* --- Endurance sur les jours restants --- */
    const eDays = availDays.filter(d => !d.run && !(info.isRaceWeek && race && d.date > race.date));
    const usedKm = days.reduce((s,d) => s + (d.run && d.run.kind!=='RACE' ? d.run.km : 0), 0);
    let remain = Math.max(0, vol - usedKm);
    eDays.forEach((d,i) => { let km = eDays.length ? Math.round(remain/eDays.length) : 0; km = Util.clamp(km, n>=6 ? 4 : 5, 14);
      const skipBonus = mode==='skipped' ? 1 : 0;
      if(mode==='voyage' && i>0){ d.run = Lib.endurance(4, i, z); d.run.title = 'Facile 25 min (optionnel en voyage)'; }
      else if(info.phase==='recuperation' || (mode==='jaune')) d.run = Lib.recup(km, z);
      else if(i===eDays.length-1 && eDays.length>=3 && !info.isRaceWeek) d.run = Lib.recup(Math.max(4, km-2), z);
      else d.run = Lib.endurance(km + skipBonus, idx+i, z); });
    if(mode==='rouge'){ days.forEach(d => { if(d.run && d.run.kind!=='RACE') d.run = d.avail ? Lib.cross() : null; }); }

    /* --- Renforcement (2 × / semaine) et extras --- */
    const easyDays = days.filter(d => d.run && d.run.kind==='E' && !(race && d.date===race.date));
    const restDays = days.filter(d => !d.run);
    let sDays = easyDays.length>=2 ? [easyDays[0], easyDays[easyDays.length-1]] : easyDays.concat(restDays).slice(0,2);
    if(info.isRaceWeek) sDays = sDays.filter(d => race && Util.daysBetween(Util.parse(d.date), Util.parse(race.date)) >= 3);
    if(mode==='voyage') sDays = sDays.slice(0,1);
    sDays.forEach((d,k) => { d.strength = (mode==='jaune'||mode==='rouge') ? Strength.isoLight() : Strength.session(idx, k, mode==='voyage'?'maison':null); if(d.strength && info.isRaceWeek){ d.strength.title += ' (léger)'; d.strength.intent = 'Charge réduite de moitié : on entretient, on ne construit pas.'; } });
    const exDays = easyDays.filter(d => !d.strength); if(exDays[0] && !['jaune','rouge','voyage'].includes(mode)) exDays[0].extra = 'gainage'; if(exDays[1] && !['jaune','rouge','voyage'].includes(mode)) exDays[1].extra = 'mobilite';
    days.forEach(d => { if(!d.run) d.run = Lib.rest(); });

    /* --- Séances modifiées par l'utilisateur (remplacement ou échange de jour) --- */
    const mv = (st.plan.moves||{})[Util.iso(monday)] || {};
    if(Object.keys(mv).length){ const gen = {}; days.forEach(d => { gen[d.date] = { run:d.run, strength:d.strength }; });
      days.forEach(d => { for(const slot of ['run','strength']){ const src = mv[`${d.date}:${slot==='run'?'run':'renfo'}`]; if(src && gen[src]){ d[slot] = gen[src][slot]; if(d[slot] && src!==d.date) d[slot].movedFrom = src; } } }); }
    const ov = st.plan.overrides || {};
    days.forEach(d => { const o = ov[`${d.date}:run`]; if(o && o.kind==='replace'){ d.run = Plan.customSession(o, z, idx, race, info.phase); } });

    /* --- Avis d'ajustement --- */
    if(mode==='skipped') notices.push('Séance sautée : on ne rattrape jamais une séance de qualité. Le reste de la semaine reste en place, +1 km sur les endurances si les jambes sont bonnes.');
    if(mode==='jaune') notices.push('Feu jaune : zéro intensité cette semaine, volume −20 %, renforcement isométrique seulement. Réévalue la douleur chaque matin.');
    if(mode==='rouge') notices.push('Feu rouge : pas de course à pied. Vélo ou marche sans douleur, isométrie légère. Si la douleur persiste plus de 5 jours, consulte un physio du sport.');
    if(mode==='fatigue') notices.push('Semaine fatiguée : volume −25 %, une seule séance de qualité, sortie longue raccourcie. Priorité au sommeil.');
    if(mode==='voyage') notices.push('Semaine en voyage : on garde l\'essentiel — une qualité et la sortie longue. Le reste est optionnel, renfo maison.');
    if(info.recovery) notices.push('Semaine allégée (−25 %) : c\'est ici que le corps assimile le travail des trois dernières semaines.');
    const totalKm = Math.round(days.reduce((s,d) => s + (d.run ? d.run.km : 0), 0)*10)/10;
    const statusOf = (d, slot) => st.plan.status[`${d.date}:${slot}`] || null;
    days.forEach(d => { d.statusRun = statusOf(d,'run'); d.statusRenfo = statusOf(d,'renfo'); });
    return { monday, info, days, notices, totalKm, mode, z }; },

  /* Séance construite depuis une modification de l'utilisateur */
  customTypes:[['endurance','Endurance'],['recup','Récupération'],['progressif','Progressif'],['tempo','Tempo'],['seuilContinu','Seuil continu'],['seuilFractionne','Seuil fractionné'],['vo2','Intervalles VO2max'],['fartlek','Fartlek'],['cotesCourtes','Côtes courtes'],['cotesLongues','Côtes longues'],['montees','Montées (trail)'],['descente','Descente (trail)'],['marcheRapide','Marche rapide en côte'],['longue','Sortie longue'],['cross','Vélo / marche'],['rest','Repos']],
  customSession(o, z, idx, race, phase){ const km = o.km || null; let s;
    switch(o.type){
      case 'endurance': s = Lib.endurance(km||8, idx, z); break;
      case 'recup': s = Lib.recup(km||5, z); break;
      case 'progressif': s = Lib.progressif(km||10, idx, z); break;
      case 'longue': s = Lib.longue(km||14, idx, z, { race, phase }); break;
      case 'cross': s = Lib.cross(); break;
      case 'rest': s = Lib.rest('Repos choisi par toi.'); break;
      default: { const f = { tempo:()=>Lib.tempo(idx,z), seuilContinu:()=>Lib.seuilContinu(idx,z), seuilFractionne:()=>Lib.seuilFractionne(idx,z), vo2:()=>Lib.vo2(idx,z), fartlek:()=>Lib.fartlek(idx,z), cotesCourtes:()=>Lib.cotesCourtes(idx,z), cotesLongues:()=>Lib.cotesLongues(idx,z), montees:()=>Lib.montees(idx,z), descente:()=>Lib.descente(idx,z), marcheRapide:()=>Lib.marcheRapide(idx,z) }[o.type];
        s = f ? f() : Lib.endurance(km||8, idx, z); if(km && s.km > km) s = Lib.fit(s, km, z); } }
    if(o.note) s.intent = o.note + ' — ' + s.intent; s.custom = true; return s; },
  /* Déplacer une séance : échange les jours A et B pour un créneau (run ou renfo), en composant avec les déplacements précédents */
  swap(a, b, slot){ if(a===b) return; const m = Util.iso(Util.monday(Util.parse(a))); if(m !== Util.iso(Util.monday(Util.parse(b)))) return;
    if(!Data.state.plan.moves) Data.state.plan.moves = {}; const wk = Data.state.plan.moves[m] = Data.state.plan.moves[m] || {}; const sfx = slot==='renfo' ? ':renfo' : ':run';
    const sa = wk[a+sfx]||a, sb = wk[b+sfx]||b; wk[a+sfx] = sb; wk[b+sfx] = sa; for(const k of [a+sfx, b+sfx]) if(wk[k]===k.split(':')[0]) delete wk[k];
    if(!Object.keys(wk).length) delete Data.state.plan.moves[m]; Data.save(); },
  /* Remettre la séance d'origine sur ce jour (échange inverse avec le jour qui la porte actuellement) */
  resetMove(date, slot){ const m = Util.iso(Util.monday(Util.parse(date))); const wk = (Data.state.plan.moves||{})[m]; if(!wk) return; const sfx = slot==='renfo' ? ':renfo' : ':run';
    const holder = Object.keys(wk).find(k => k.endsWith(sfx) && wk[k]===date); if(holder) Plan.swap(date, holder.split(':')[0], slot); },
  setOverride(key, o){ if(!Data.state.plan.overrides) Data.state.plan.overrides = {}; if(o) Data.state.plan.overrides[key] = o; else delete Data.state.plan.overrides[key]; Data.save(); },
  forDate(iso){ const w = Plan.build(Util.monday(Util.parse(iso))); return { week:w, day:w.days.find(d => d.date===iso) }; },
  setStatus(key, status){ if(status) Data.state.plan.status[key] = status; else delete Data.state.plan.status[key]; Data.save(); },
  setAdjust(mondayIso, mode, day){ if(!mode) delete Data.state.plan.adjust[mondayIso]; else Data.state.plan.adjust[mondayIso] = { mode, day:day||null, at:Util.iso(Util.today()) }; Data.save(); },
};

/* ============================== 7. STATS ================================ */
const Stats = {
  typeZone:{ endurance:{E:1}, recuperation:{E:1}, tempo:{E:.55,M:.45}, seuil:{E:.5,T:.5}, intervalles:{E:.55,I:.45}, fartlek:{E:.6,I:.4}, cotes:{E:.6,C:.4}, longue:{E:.9,M:.1}, trail:{E:.75,C:.25}, course:{M:.6,T:.4}, autre:{E:1}, renfo:{} },
  typeName:{ endurance:'Endurance', recuperation:'Récupération', tempo:'Tempo', seuil:'Seuil', intervalles:'Intervalles', fartlek:'Fartlek', cotes:'Côtes', longue:'Sortie longue', trail:'Trail', course:'Course', renfo:'Renforcement', autre:'Autre' },
  runs(){ return Data.state.activities.filter(a => a.type!=='renfo'); },
  between(a, b){ return Stats.runs().filter(x => x.date >= a && x.date <= b); },
  km(list){ return Math.round(list.reduce((s,a) => s + (a.distance||0), 0)*10)/10; },
  load(a){ const dur = (a.duration||0)/60; const rpe = a.feel ? Util.clamp(11 - a.feel, 1, 10) : 5; return dur ? dur*rpe : (a.distance||0)*6*5; }, // ressenti 10 = très facile
  acwr(){ const t = Util.today(); const d = n => Util.iso(Util.addDays(t, -n));
    const acute = Stats.runs().filter(a => a.date > d(7) && a.date <= Util.iso(t)).reduce((s,a)=>s+Stats.load(a),0);
    const chronic = Stats.runs().filter(a => a.date > d(28) && a.date <= Util.iso(t)).reduce((s,a)=>s+Stats.load(a),0)/4;
    return { acute:Math.round(acute), chronic:Math.round(chronic), ratio: chronic>0 ? Math.round(acute/chronic*100)/100 : null }; },
  weeksBack(n){ const out=[]; const m0 = Util.monday(Util.today()); for(let i=n-1;i>=0;i--){ const m = Util.addDays(m0,-7*i); const list = Stats.between(Util.iso(m), Util.iso(Util.addDays(m,6))); out.push({ monday:m, km:Stats.km(list), n:list.length }); } return out; },
  zones(list){ const z={E:0,M:0,T:0,I:0,C:0}; for(const a of list){ const w = Stats.typeZone[a.type]||{E:1}; const min = (a.duration||0)/60 || (a.distance||0)*6; for(const k in w) z[k] = (z[k]||0) + min*w[k]; } return z; },
  byType(list){ const o={}; for(const a of list){ o[a.type] = (o[a.type]||0) + (a.distance||0); } return o; },
  streak(){ let s=0; const m0 = Util.monday(Util.today()); for(let i=0;i<104;i++){ const m = Util.addDays(m0,-7*i); const n = Stats.between(Util.iso(m), Util.iso(Util.addDays(m,6))).length; if(n>0) s++; else if(i>0) break; } return s; },
  bestOf(key){ return Data.state.records.filter(r => r.distanceKey===key).sort((a,b)=>a.time-b.time)[0] || null; },
  addRecordIfBest(distanceKey, time, date, label, raceId){ const best = Stats.bestOf(distanceKey); Data.state.records.push({ id:Util.uid(), distanceKey, time, date, label, raceId:raceId||null }); return !best || time < best.time; },
};

  /* Check-list générée depuis la course */
  checklist(r){ const z = Physio.zones(); const goal = r.goalTime || (r.type==='trail' ? Physio.predictTrail(z.vdot, r.distanceKm, r.elevation) : Physio.predict(z.vdot, r.distanceKm*1000));
    const hours = goal/3600; const pace = goal/r.distanceKm; const items = [];
    const push = (g, t) => items.push({ key:g+':'+items.length, group:g, text:t });
    // Matériel
    push('Matériel', 'Chaussures rodées et chaussettes testées'); push('Matériel','Dossard épinglé, puce vérifiée'); push('Matériel','Montre chargée, séance de course créée dans Garmin');

      push('Nutrition', `Boire ${r.type==='trail'?'500–600':'400–500'} ml/h, électrolytes${hours>=2?' dès le départ':''}`); }
    else push('Nutrition','Course courte : un gel 15 min avant suffit, eau aux ravitos');
    if(r.type==='trail') push('Nutrition','Mange même si tu n\'as pas faim, bois même si tu n\'as pas soif');

    if(r.type==='route'){ push('Allures', `Allure cible ${Util.fmtPace(pace)}/km · arrivée ${Util.fmtTime(goal)}`); push('Allures', `Km 1–3 : ${Util.fmtPace(pace+8)}/km (contrôlé)`);

      push('Allures', 'Derniers 3 km : tout ce qu\'il reste'); }
    else { push('Allures', `Temps estimé ${Util.fmtTime(goal)} (${r.distanceKm} km, ${r.elevation} m D+)`); push('Allures','Premier tiers : conservateur, marche toutes les pentes fortes'); push('Allures','Deuxième tiers : régulier, ravito à chaque poste'); push('Allures','Dernier tiers : relâché en descente, on engage si les jambes sont là'); push('Allures','Gère à l\'effort et à la FC, jamais à l\'allure'); }

};

  sessRow(d, s, slot){ if(!s) return ''; const status = slot==='run' ? d.statusRun : d.statusRenfo; const meta = slot==='run' ? (s.kind==='X' ? s.intent.slice(0,60) : `${s.km ? Util.km(s.km)+' km · ' : ''}${Util.fmtDur(s.min)}`) : `${Util.fmtDur(s.min)} · ${Data.state.profile.gymPref}`;

  extraRow(d){ if(!d.extra) return ''; const x = Strength.extras[d.extra]; return `<div class="sess" style="opacity:.8"><i class="sw S"></i><div class="t"><b>${x.title}</b><span>${x.items.join(' · ')}</span></div></div>`; },

  /* ================= Écran Aujourd'hui ================= */
  home(){ const today = Util.iso(Util.today()); const { week, day } = Plan.forDate(today); const s = day.run; const z = week.z; const race = week.info.race || Plan.raceA(); const p = Data.state.profile;

        <div class="btnrow" style="margin-top:14px">${s.kind!=='X' ? `<button class="btn primary" onclick="UI.openSession('${today}')">Voir les étapes</button>`:''}<button class="btn" onclick="UI.openLog()">Enregistrer une séance</button></div>
      </div>
      ${day.statusRun ? `<div class="notice">Statut du jour : ${({done:'faite',modified:'modifiée',skipped:'sautée'})[day.statusRun]}.</div>`:''}
      ${strength}
      ${raceHtml}
      <div class="card"><div class="row between"><h3>Cette semaine</h3><span class="small muted">${Plan.phaseName[week.info.phase]}${week.info.recovery?' · allégée':''}</span></div>
        <div class="grid3" style="margin-top:10px"><div class="stat"><div class="v num">${Util.km(km)}</div><div class="l">km faits</div></div><div class="stat"><div class="v num">${Util.km(week.totalKm)}</div><div class="l">km prévus</div></div><div class="stat"><div class="v num">${done}/${planned}</div><div class="l">séances</div></div></div>
        ${week.notices.length?`<div class="small muted" style="margin-top:10px">${Util.esc(week.notices[0])}</div>`:''}
        <button class="btn sm" style="margin-top:12px" onclick="UI.go('plan')">Voir la semaine</button></div>
      <div class="section-title"><h2>Dernières séances</h2><button class="small" style="color:var(--accent);font-weight:600" onclick="UI.go('journal')">Journal</button></div>
      <div class="card list">${recent.length ? recent.map(UI.actRow).join('') : '<div class="empty">Aucune séance enregistrée. Après ta prochaine sortie, note-la en 30 secondes.</div>'}</div>`; },
  phaseLine(info){ const c = info.c; if(!c.race) return ''; const segs = []; for(let i=0;i<=c.raceIdx;i++) segs.push(Plan.phaseOf(i,c)); const idx = info.rel;
    return `<div class="phaseline">${segs.map((ph,i)=>`<i class="${Plan.phaseClass[ph]} ${i===idx?'cur':''}" style="flex:1"></i>`).join('')}</div>`; },
  actRow(a){ const t = Stats.typeName[a.type]||a.type; const pace = a.distance && a.duration ? Util.fmtPace(a.duration/a.distance)+'/km' : '';
    return `<button class="item" style="width:100%;text-align:left" onclick="UI.openLog('${a.id}')"><i class="sw ${({intervalles:'I',seuil:'T',tempo:'M',cotes:'C',trail:'C',renfo:'S',course:'M'})[a.type]||'E'}" style="width:6px;height:36px;border-radius:3px;background:var(--z${({intervalles:'I',seuil:'T',tempo:'M',cotes:'C',trail:'C',renfo:'S',course:'M'})[a.type]||'E'})"></i><div class="t"><b>${Util.esc(t)}${a.notes?` · <span class="muted" style="font-weight:400">${Util.esc(a.notes.slice(0,40))}</span>`:''}</b><span>${Util.fmtDate(a.date)}${a.feel?` · ressenti ${a.feel}/10`:''}${a.pain?` · douleur ${a.pain}/10`:''}</span></div><div class="r num">${a.distance?`<b>${Util.km(a.distance)} km</b><br>`:''}<span class="muted small">${a.duration?Util.fmtTime(a.duration):''}${pace?' · '+pace:''}</span></div></button>`; },

  /* ================= Écran Plan ================= */
  plan(){ const monday = Util.addDays(Util.monday(Util.today()), UI.weekOffset*7); const w = Plan.build(monday); const info = w.info; const today = Util.iso(Util.today());
    const z = w.z; const zonesHtml = ['E','M','T','I'].map(k => `<span class="small"><span class="pill z ${k}">${k}</span> ${Physio.zoneLabel(z,k)}</span>`).join('<br>');
    return `
      <div class="weeknav"><button class="iconbtn" onclick="UI.weekOffset--;UI.render()" aria-label="Semaine précédente">‹</button><div class="title"><b>${UI.weekOffset===0?'Cette semaine':UI.weekOffset===1?'Semaine prochaine':UI.weekOffset===-1?'Semaine dernière':(info.race && info.rel>=0 ? 'Semaine '+(info.rel+1)+' du bloc' : 'Récupération')}</b><span>${Util.weekLabel(monday)}</span></div><button class="iconbtn" onclick="UI.weekOffset++;UI.render()" aria-label="Semaine suivante">›</button></div>
      <div class="card"><div class="row between"><div><span class="pill">${Plan.phaseName[info.phase]}${info.recovery?' · allégée':''}${info.isRaceWeek?' · semaine de course':''}</span></div><div class="num"><b>${Util.km(w.totalKm)} km</b> <span class="muted small">prévus</span></div></div>
        ${UI.phaseLine(info)}
        ${info.race ? `<div class="small muted">${info.inGap ? `Récupération post-course · prochain bloc : ${Util.esc(info.race.name)}` : `Vers ${Util.esc(info.race.name)} · semaine ${info.rel+1} de ${info.c.N}`}${info.nextRace ? ` · ensuite : ${Util.esc(info.nextRace.name)}` : ''}</div>`:'<div class="small muted">Aucune course à venir : crée un nouveau plan pour générer un entraînement ciblé.</div>'}
        <div class="btnrow" style="margin-top:12px"><button class="btn sm" onclick="UI.openAdjust('${Util.iso(monday)}')">${w.mode?'Ajustement : '+({skipped:'séance sautée',jaune:'feu jaune',rouge:'feu rouge',fatigue:'fatigue',voyage:'voyage'})[w.mode]:'Ajuster la semaine'}</button><button class="btn sm ${info.race?'':'primary'}" onclick="UI.openNewPlan()">Nouveau plan</button>${UI.weekOffset!==0?`<button class="btn sm" onclick="UI.weekOffset=0;UI.render()">Aujourd'hui</button>`:''}</div></div>
      ${UI.seasonCard()}

      <p class="tiny muted" style="margin:-4px 0 8px">Glisse une séance par sa poignée ⋮⋮ sur un autre jour pour les échanger.</p>
      <div class="card" style="padding:6px 16px">${w.days.map(d => `<div class="day ${d.date===today?'today':''}" data-date="${d.date}"><div class="d"><b>${Util.dowShort[d.dow]}</b><span>${Util.parse(d.date).getDate()}</span></div><div class="body">${UI.sessRow(d, d.run, 'run')}${UI.sessRow(d, d.strength, 'renfo')}${UI.extraRow(d)}</div></div>`).join('')}</div>
      <details class="card"><summary>Zones de cette semaine (VDOT ${z.vdot})</summary><div class="body" style="line-height:1.9">${zonesHtml}<br><span class="small"><span class="pill z M">AC</span> allure course cible ${Util.fmtPace(z.AC)}/km</span></div></details>`; },

  /* Carte « Ma saison » : la chaîne des blocs, de course en course */
  seasonCard(){ const se = Plan.season(); if(!se.segs.length) return '';
    const t = Util.iso(Util.today()); const curIdx = Math.round(Util.daysBetween(se.start, Util.monday(Util.today()))/7);
    return `<details class="card"><summary>Ma saison · ${se.segs.length} bloc${se.segs.length>1?'s':''} de course</summary><div class="body">
      ${se.segs.map(s => { const done = s.race.date < t; const cur = !done && curIdx >= s.startIdx && curIdx <= s.raceIdx;
        const startDate = Util.iso(Util.addDays(se.start, s.startIdx*7));
        return `<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line);gap:10px;${done?'opacity:.5':''}">
          <div style="min-width:0"><b>${Util.esc(s.race.name)}</b><div class="small muted">${Util.fmtDate(s.race.date, true)} · ${s.race.distanceKm} km ${s.race.type==='trail'?'trail':'route'} · priorité ${s.race.priority}</div></div>
          <div class="small" style="text-align:right;flex:none">${done ? 'Terminé' : cur ? `<b style="color:var(--accent)">Bloc en cours</b><br><span class="muted">${s.N} sem.</span>` : `Bloc de ${s.N} sem.<br><span class="muted">dès le ${Util.fmtDate(startDate)}</span>`}</div></div>`; }).join('')}
      <p class="tiny muted" style="margin-top:8px">Chaque course A ou B a son bloc : base → développement → spécifique → affûtage → course → récupération, puis le bloc suivant démarre tout seul. Quand une course plus longue suit (ex. marathon après un 10 km), la sortie longue reste développée pour elle pendant le bloc en cours. Les courses C restent des courses de passage, intégrées à leur semaine.</p></div></details>`; },

  /* ================= Écran Journal ================= */
  journal(){ const t = Util.today(); const m = Util.monday(t); const wk = Stats.between(Util.iso(m), Util.iso(Util.addDays(m,6)));
    const mo = Stats.between(Util.iso(new Date(t.getFullYear(), t.getMonth(), 1)), Util.iso(t)); const ac = Stats.acwr(); const weeks = Stats.weeksBack(12); const max = Math.max(10, ...weeks.map(w=>w.km));
    const planWeek = Plan.build(m); const last28 = Stats.between(Util.iso(Util.addDays(t,-28)), Util.iso(t)); const zn = Stats.zones(last28); const ztot = Object.values(zn).reduce((a,b)=>a+b,0)||1;
    const byT = Stats.byType(last28); const acwrClass = ac.ratio==null?'':ac.ratio>1.5?'rouge':ac.ratio>1.3?'jaune':ac.ratio<0.8?'jaune':'vert';
    const donePlanned = planWeek.days.filter(d=>d.statusRun==='done').length, plannedN = planWeek.days.filter(d=>d.run&&d.run.kind!=='X').length;
    let list = Data.state.activities.slice().sort((a,b)=>b.date<a.date?-1:1);
    if(UI.filter.type!=='all') list = list.filter(a=>a.type===UI.filter.type); if(UI.filter.period!=='all') list = list.filter(a => a.date >= Util.iso(Util.addDays(t, -parseInt(UI.filter.period))));
    return `
      <button class="btn primary" onclick="UI.openLog()" style="margin-bottom:12px">Enregistrer une séance</button>
      <div class="grid3"><div class="stat"><div class="v num">${Util.km(Stats.km(wk))}</div><div class="l">km cette semaine</div></div><div class="stat"><div class="v num">${Util.km(Stats.km(mo))}</div><div class="l">km ce mois-ci</div></div><div class="stat"><div class="v num">${Stats.streak()}</div><div class="l">semaines actives</div></div></div>
      <div class="card" style="margin-top:12px"><div class="row between"><h3>Volume · 12 semaines</h3><span class="small muted num">planifié ${Util.km(planWeek.totalKm)} km</span></div>
        <div class="bars">${weeks.map((w,i)=>`<div class="b ${i===11?'cur':''}"><i style="height:${Math.round(w.km/max*100)}%"></i><span>${Util.parse(Util.iso(w.monday)).getDate()}</span></div>`).join('')}</div>
        <div class="row between small muted"><span>Planifié vs réalisé cette semaine : ${donePlanned}/${plannedN} séances · ${Util.km(Stats.km(wk))}/${Util.km(planWeek.totalKm)} km</span></div></div>
      <div class="card"><div class="row between"><h3>Charge d'entraînement</h3><span class="pill" style="${acwrClass?`background:color-mix(in srgb,var(--${acwrClass}) 25%,transparent);color:var(--${acwrClass})`:''}">${ac.ratio==null?'—':ac.ratio}</span></div>
        <p class="small muted" style="margin-top:6px">Ratio aigu/chronique (7 j vs 28 j). Zone sûre 0,8–1,3. Au-dessus de 1,5 : risque de blessure élevé, allège. ${ac.ratio==null?'Enregistre des séances sur 4 semaines pour l\'activer.':''}</p>
        <div class="grid2" style="margin-top:10px"><div class="stat"><div class="v num">${ac.acute}</div><div class="l">charge 7 jours</div></div><div class="stat"><div class="v num">${ac.chronic}</div><div class="l">charge moy. / semaine (28 j)</div></div></div></div>
      <div class="card"><h3>Temps en zones · 28 jours</h3><p class="small muted">Estimation à partir du type de séance.</p>
        <div class="zbar">${['E','M','T','I','C'].map(k=>`<i style="width:${(zn[k]/ztot*100).toFixed(1)}%;background:var(--z${k})"></i>`).join('')}</div>
        <div class="legend">${['E','M','T','I','C'].map(k=>`<span><i style="background:var(--z${k})"></i>${Physio.zoneName[k]} ${Math.round(zn[k])} min</span>`).join('')}</div>
        ${Object.keys(byT).length?`<div class="small muted" style="margin-top:10px">Volume par type : ${Object.entries(byT).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${Stats.typeName[k]||k} ${Util.km(v)} km`).join(' · ')}</div>`:''}</div>

        <select class="chip" style="flex:1;border:0" onchange="UI.filter.period=this.value;UI.render()">${[['30','30 jours'],['90','90 jours'],['365','12 mois'],['all','Tout']].map(([k,v])=>`<option value="${k}" ${UI.filter.period===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="card list">${list.length?list.map(UI.actRow).join(''):'<div class="empty">Rien pour cette période.</div>'}</div>`; },

  /* ================= Écran Courses ================= */
  races(){ const t = Util.iso(Util.today()); const rs = Data.state.races.slice().sort((a,b)=>a.date<b.date?-1:1); const up = rs.filter(r=>r.date>=t), past = rs.filter(r=>r.date<t).reverse(); const z = Physio.zones();

        return `<tr onclick="UI.openPR('${k}')"><td>${k.replace('K',' km').replace(' kmT',' km trail')}</td><td class="num">${b?Util.fmtTime(b.time):'<span class="muted">—</span>'}</td><td class="r muted small">${b?Util.fmtDate(b.date,true):''}</td><td class="r num muted">${pred?Util.fmtTime(pred):''}</td></tr>`;}).join('')}</table>

      <div class="section-title"><h2>Pourquoi chaque séance</h2></div><div class="card">${Coach.sessionTypes.map(([t,d,y])=>`<details><summary>${t}</summary><div class="body"><p>${d}</p><p class="small"><a href="${Lib.ytLink(y)}" target="_blank" rel="noopener">▶ ${Lib.yt[y]}</a></p></div></details>`).join('')}</div>
